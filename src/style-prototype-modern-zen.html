<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Zen - App Store Style Prototype</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --m-bg: #fdfbf7;
            --m-surface: #ffffff;
            --m-accent: #a39171;
            --m-text: #3b3a37;
            --m-muted: #858178;
            --m-border: rgba(163, 145, 113, 0.1);
            --m-radius-lg: 24px;
            --m-radius-sm: 12px;
            --m-shadow: 0 10px 30px rgba(0,0,0,0.04), 0 1px 8px rgba(0,0,0,0.02);
            --m-shadow-hover: 0 20px 40px rgba(0,0,0,0.08), 0 2px 12px rgba(0,0,0,0.04);
        }

        body {
            background-color: var(--m-bg);
            margin: 0;
            padding: 0;
            font-family: var(--font-sans);
            color: var(--m-text);
            -webkit-font-smoothing: antialiased;
        }

        /* Paper Grain Overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            opacity: 0.4;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .app-shell {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--m-bg);
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Header - Apple Style Glass */
        .modern-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            margin-bottom: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(253, 251, 247, 0.8);
        }
        .modern-header h1 {
            font-family: var(--font-serif);
            font-size: 24px;
            margin: 0;
            color: var(--m-text);
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--m-accent);
            border: 2px solid white;
            box-shadow: var(--m-shadow);
        }

        /* Hero Card - App Store Featured Style */
        .hero-card {
            background: var(--m-surface);
            border-radius: var(--m-radius-lg);
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: var(--m-shadow);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            border: 1px solid var(--m-border);
            position: relative;
            overflow: hidden;
        }
        .hero-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--m-shadow-hover);
        }
        .hero-card .tag {
            display: inline-block;
            padding: 4px 12px;
            background: var(--m-accent);
            color: white;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .hero-card h2 {
            font-family: var(--font-serif);
            font-size: 32px;
            margin: 0 0 12px 0;
            line-height: 1.2;
        }
        .hero-card p {
            font-size: 15px;
            color: var(--m-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .hero-card .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--m-text);
            color: white;
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
        }
        .hero-card .btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        /* Section Title */
        .section-title {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 600;
            margin: 32px 0 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title a {
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--m-accent);
            text-decoration: none;
            font-weight: 500;
        }

        /* Bento Grid for Categories */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .bento-item {
            background: var(--m-surface);
            border-radius: var(--m-radius-lg);
            padding: 20px;
            box-shadow: var(--m-shadow);
            border: 1px solid var(--m-border);
            transition: all 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }
        .bento-item:hover {
            transform: scale(1.02);
            box-shadow: var(--m-shadow-hover);
        }
        .bento-item.wide {
            grid-column: span 2;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }
        .bento-item .icon {
            font-size: 24px;
            margin-bottom: 12px;
        }
        .bento-item .name {
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: 16px;
        }

        /* List View - App Store Style */
        .modern-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modern-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            background: var(--m-surface);
            border-radius: var(--m-radius-sm);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid var(--m-border);
            transition: all 0.3s;
            cursor: pointer;
        }
        .modern-item:hover {
            background: #fdfdfd;
            transform: translateX(4px);
            border-color: var(--m-accent);
        }
        .modern-item .cover {
            width: 50px;
            height: 70px;
            background: var(--m-accent);
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .modern-item .info {
            flex: 1;
        }
        .modern-item .info .title {
            font-family: var(--font-serif);
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .modern-item .info .meta {
            font-size: 12px;
            color: var(--m-muted);
        }
        .modern-item .action-btn {
            padding: 6px 12px;
            border-radius: 100px;
            background: var(--m-bg);
            border: 1px solid var(--m-border);
            font-size: 12px;
            font-weight: 600;
            color: var(--m-text);
        }

    </style>
</head>
<body>

    <div class="app-shell">
        <header class="modern-header">
            <h1>DeathNote</h1>
            <div class="user-avatar"></div>
        </header>

        <!-- Hero Section -->
        <div class="hero-card">
            <div class="tag">本月精選</div>
            <h2>象牙之塔的<br>冬日回響</h2>
            <p>在最純淨的暖白空間中，探索关于存在与虚无的文学思考。一次关于静默的深度阅读之旅。</p>
            <a href="#" class="btn">立即阅读 →</a>
        </div>

        <!-- Categories Section -->
        <div class="section-title">
            <span>探索題材</span>
            <a href="#">查看全部</a>
        </div>
        <div class="bento-grid">
            <div class="bento-item">
                <div class="icon">🔍</div>
                <div class="name">懸疑</div>
            </div>
            <div class="bento-item">
                <div class="icon">🌿</div>
                <div class="name">治癒</div>
            </div>
            <div class="bento-item wide">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div class="icon">✨</div>
                    <div class="name">奇幻文學</div>
                </div>
                <div style="font-size:12px; color:var(--m-muted);">128 本書</div>
            </div>
            <div class="bento-item">
                <div class="icon">📖</div>
                <div class="name">文學</div>
            </div>
            <div class="bento-item">
                <div class="icon">🌙</div>
                <div class="name">恐怖</div>
            </div>
        </div>

        <!-- Ranking Section -->
        <div class="section-title">
            <span>熱門排行</span>
            <a href="#">排行榜</a>
        </div>
        <div class="modern-list">
            <div class="modern-item">
                <div class="cover"></div>
                <div class="info">
                    <div class="title">鼠尾草之梦</div>
                    <div class="meta">自然主义 · 4.9⭐</div>
                </div>
                <div class="action-btn">閱讀</div>
            </div>
            <div class="modern-item">
                <div class="cover" style="background: var(--m-accent-light);"></div>
                <div class="info">
                    <div class="title">雨后苔藓笔记</div>
                    <div class="meta">静谧观察 · 4.7⭐</div>
                </div>
                <div class="action-btn">閱讀</div>
            </div>
            <div class="modern-item">
                <div class="cover" style="background: #c4b8a4;"></div>
                <div class="info">
                    <div class="title">古木的低语</div>
                    <div class="meta">文学随笔 · 4.5⭐</div>
                </div>
                <div class="action-btn">閱讀</div>
            </div>
        </div>

        <div style="height: 100px;"></div>
    </div>

</body>
</html>
