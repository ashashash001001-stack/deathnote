<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Zen - Readable Prototype</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --m-bg: #f8f6f1;
            --m-surface: #ffffff;
            --m-accent: #8b7355;
            --m-accent-solid: #a39171;
            --m-text: #1a1a1a;
            --m-text-secondary: #4a4a4a;
            --m-muted: #6b6b6b;
            --m-border: rgba(0, 0, 0, 0.08);
            --m-radius: 20px;
            --m-shadow: 0 4px 20px rgba(0,0,0,0.06);
            --m-shadow-hover: 0 12px 32px rgba(0,0,0,0.1);
        }

        body {
            background-color: var(--m-bg);
            margin: 0;
            padding: 0;
            font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--m-text);
            -webkit-font-smoothing: antialiased;
            line-height: 1.5;
        }

        .app-shell {
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--m-bg);
            position: relative;
            padding: 16px;
            box-sizing: border-box;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 4px 24px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            font-family: var(--font-serif);
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--m-accent);
        }

        /* Hero Card - High Contrast */
        .hero-card {
            background: var(--m-surface);
            border-radius: var(--m-radius);
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: var(--m-shadow);
            transition: transform 0.3s;
        }
        .hero-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--m-shadow-hover);
        }
        .hero-tag {
            display: inline-block;
            padding: 5px 10px;
            background: var(--m-accent-solid);
            color: white;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .hero-title {
            font-family: var(--font-serif);
            font-size: 26px;
            font-weight: 700;
            color: var(--m-text);
            margin: 0 0 8px;
            line-height: 1.3;
        }
        .hero-desc {
            font-size: 15px;
            color: var(--m-text-secondary);
            line-height: 1.6;
            margin: 0 0 20px;
        }
        .hero-btn {
            display: inline-flex;
            align-items: center;
            background: var(--m-text);
            color: white;
            padding: 12px 22px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        /* Section */
        .section {
            margin-bottom: 28px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
        }
        .section-more {
            font-size: 14px;
            color: var(--m-accent-solid);
            text-decoration: none;
            font-weight: 500;
        }

        /* Bento Grid */
        .bento {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .bento-item {
            background: var(--m-surface);
            border-radius: var(--m-radius);
            padding: 18px;
            box-shadow: var(--m-shadow);
            transition: all 0.3s;
            cursor: pointer;
        }
        .bento-item:hover {
            transform: scale(1.02);
        }
        .bento-item.wide {
            grid-column: span 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bento-icon {
            font-size: 22px;
            margin-bottom: 8px;
        }
        .bento-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--m-text);
        }
        .bento-count {
            font-size: 12px;
            color: var(--m-muted);
        }

        /* List */
        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .list-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: var(--m-surface);
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: all 0.3s;
            cursor: pointer;
        }
        .list-item:hover {
            background: #fdfdfd;
        }
        .list-cover {
            width: 44px;
            height: 64px;
            background: var(--m-accent);
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }
        .list-info {
            flex: 1;
            min-width: 0;
        }
        .list-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--m-text);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-meta {
            font-size: 13px;
            color: var(--m-text-secondary);
        }
        .list-btn {
            padding: 6px 14px;
            background: var(--m-bg);
            border: 1px solid var(--m-border);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: var(--m-text);
            white-space: nowrap;
        }

    </style>
</head>
<body>

    <div class="app-shell">
        
        <header class="header">
            <h1>DeathNote</h1>
            <div class="avatar"></div>
        </header>

        <!-- Hero -->
        <div class="hero-card">
            <div class="hero-tag">本月精選</div>
            <h2 class="hero-title">象牙之塔的<br>冬日回響</h2>
            <p class="hero-desc">在最純淨的暖白空间中，探索關於存在與虛無的文學思考。</p>
            <a href="#" class="hero-btn">立即閱讀 →</a>
        </div>

        <!-- Categories -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">探索題材</span>
                <a href="#" class="section-more">查看全部 →</a>
            </div>
            <div class="bento">
                <div class="bento-item">
                    <div class="bento-icon">🔍</div>
                    <div class="bento-name">懸疑</div>
                </div>
                <div class="bento-item">
                    <div class="bento-icon">🌿</div>
                    <div class="bento-name">治癒</div>
                </div>
                <div class="bento-item wide">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div class="bento-icon">✨</div>
                        <div class="bento-name">奇幻文學</div>
                    </div>
                    <div class="bento-count">128 本</div>
                </div>
                <div class="bento-item">
                    <div class="bento-icon">📖</div>
                    <div class="bento-name">文學</div>
                </div>
                <div class="bento-item">
                    <div class="bento-icon">🌙</div>
                    <div class="bento-name">恐怖</div>
                </div>
            </div>
        </div>

        <!-- Ranking -->
        <div class="section">
            <div class="section-header">
                <span class="section-title">熱門排行</span>
                <a href="#" class="section-more">排行榜 →</a>
            </div>
            <div class="list">
                <div class="list-item">
                    <div class="list-cover"></div>
                    <div class="list-info">
                        <div class="list-title">鼠尾草之夢</div>
                        <div class="list-meta">自然主義 · 4.9⭐</div>
                    </div>
                    <div class="list-btn">閱讀</div>
                </div>
                <div class="list-item">
                    <div class="list-cover" style="background: #c4b8a4;"></div>
                    <div class="list-info">
                        <div class="list-title">雨後苔蘚筆記</div>
                        <div class="list-meta">靜謐觀察 · 4.7⭐</div>
                    </div>
                    <div class="list-btn">閱讀</div>
                </div>
                <div class="list-item">
                    <div class="list-cover" style="background: #b0a590;"></div>
                    <div class="list-info">
                        <div class="list-title">古木的低語</div>
                        <div class="list-meta">文學隨筆 · 4.5⭐</div>
                    </div>
                    <div class="list-btn">閱讀</div>
                </div>
            </div>
        </div>

        <div style="height: 60px;"></div>
    </div>

</body>
</html>
