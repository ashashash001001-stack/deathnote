<style>/* ═══════════════════════════════════════════════════════════
   ZEN & ELEGANT BOOKSTORE DESIGN SYSTEM
   Japanese Wabi-Sabi / Zen Aesthetic
   ═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   1. DESIGN TOKENS - Japanese Wabi-Sabi
   ═══════════════════════════════════════════════════════════ */

:root {
  /* Background Colors (Warm Paper & Earth Tones) */
  --bg-outer: #d8d4cd;
  --bg-base: #f7f5f0;
  --bg-card: #ffffff;
  --bg-reading: #f2ebd9;
  
  /* Text Colors (Reduced contrast for eye protection) */
  --text-main: #3b3a37;
  --text-dark: #3b3a37;
  --text-muted: #858178;
  --text-sub: #858178;
  
  /* Accent Color (Dried leaf/earth gold) */
  --accent: #a39171;
  --accent-hover: #8b7a5d;
  --accent-light: #c4b8a4;
  
  /* Legacy mappings for compatibility */
  --color-primary: #a39171;
  --color-primary-light: #b5a589;
  --color-primary-dark: #8a7860;
  
  --color-bg: var(--bg-outer);
  --color-surface: var(--bg-base);
  --color-surface-glass: rgba(247, 245, 240, 0.85);
  
  --color-text-primary: var(--text-dark);
  --color-text-secondary: var(--text-muted);
  --color-text-tertiary: #a8a49c;
  
  /* Warm Border Colors */
  --border-light: #e5e0d8;
  --border-medium: #d2c9b8;
  --border-dark: #c4b8a4;
  
  /* Category Accent Colors */
  --accent-suspense: #5c5c5c;
  --accent-healing: #7d9a7d;
  --accent-scifi: #6b7a8f;
  --accent-romance: #b08b8b;
  --accent-fantasy: #8b7dab;
  --accent-horror: #8b5c5c;
  --accent-comedy: #b8a86b;
  --accent-literary: #7a7a7a;
  
  --color-success: #7d9a7d;
  --color-warning: #b8a86b;
  --color-error: #b07070;
  --color-info: #6b7a8f;
  
  --color-border-light: rgba(0, 0, 0, 0.04);
  --color-border: rgba(0, 0, 0, 0.08);
  --color-border-strong: rgba(0, 0, 0, 0.12);
  
  /* ═══════════════════════════════════════════════════════════
     2. SHADOW SYSTEM - Soft, Asymmetric (Wabi-Sabi)
     ═══════════════════════════════════════════════════════════ */
  
  --shadow-xs: 2px 4px 8px rgba(0, 0, 0, 0.04);
  --shadow-sm: -4px 8px 16px rgba(0, 0, 0, 0.05);
  --shadow-md: -6px 12px 20px rgba(0, 0, 0, 0.06);
  --shadow-lg: -8px 16px 28px rgba(0, 0, 0, 0.07);
  --shadow-xl: -10px 20px 36px rgba(0, 0, 0, 0.08);
  --shadow-glow: none;
  
  --shadow-card: var(--shadow-sm);
  --shadow-card-hover: var(--shadow-md);
  --shadow-sheet: var(--shadow-lg);
  --shadow-sticky: var(--shadow-sm);
  --shadow-float: var(--shadow-md);
  --shadow-deep: var(--shadow-xl);
  --shadow-hover: var(--shadow-md);
  
  /* ═══════════════════════════════════════════════════════════
     3. SPACING - Relaxed, Breathable
     ═══════════════════════════════════════════════════════════ */
  
  --spacing-1: 4px;
  --spacing-2: 8px;
  --spacing-3: 12px;
  --spacing-4: 16px;
  --spacing-5: 20px;
  --spacing-6: 24px;
  --spacing-8: 32px;
  --spacing-10: 40px;
  --spacing-12: 48px;
  --spacing-16: 64px;
  
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;
  
  /* ═══════════════════════════════════════════════════════════
     4. TYPOGRAPHY - Literary vs Functional
     ═══════════════════════════════════════════════════════════ */
  
  /* Content/Title Fonts (Literary, Serif) */
  --font-serif: "Noto Serif TC", "Songti TC", "PMingLiU", "Georgia", serif;
  --font-serif-ja: "Shippori Mincho", "Yu Mincho", serif;
  
  /* Interface/Navigation Fonts (Functional, Sans) */
  --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-sans-ja: "Hiragino Kaku Gothic Pro", "Yu Gothic", system-ui, sans-serif;
  
  /* Font sizes */
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-hero: 2.25rem;
  
  /* Reader typography */
  --reader-font-size: 18px;
  --reader-line-height: 2.4;
  --reader-letter-spacing: 1.8px;
  --reader-text-indent: 2em;
  --reader-paragraph-spacing: 1.8em;
  
  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;
  
  /* ═══════════════════════════════════════════════════════════
     5. BORDER RADIUS - Soft, Organic
     ═══════════════════════════════════════════════════════════ */
  
  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-2xl: 16px;
  --radius-full: 9999px;
  
  --radius-xs: 2px;
  
  /* ═══════════════════════════════════════════════════════════
     6. MOTION - Gentle, Silent
     ═══════════════════════════════════════════════════════════ */
  
  --motion-instant: 0ms;
  --motion-fast: 150ms;
  --motion-normal: 300ms;
  --motion-slow: 450ms;
  --motion-smooth: 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  
  --t-fast: 150ms;
  --t-normal: 300ms;
  --t-slow: 450ms;
  --t-silent: 600ms ease-out;
  --t-bounce: 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
  
  --glass-bg: rgba(247, 245, 240, 0.95);
  --glass-border: rgba(0, 0, 0, 0.06);
  --glass-blur: blur(8px);
  --glass-shadow: var(--shadow-md);
  
  --reader-bg: var(--bg-reading);
  --reader-text: var(--text-dark);
}

/* ===== TAB CONTENT SYSTEM ===== */
.tab-content {
  display: block;
  animation: fadeIn var(--t-silent) forwards;
}
.tab-content.hidden {
  display: none;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== FUSION STYLE - Book Spine Vertical Text ===== */
.book-spine {
  writing-mode: vertical-rl;
  letter-spacing: 8px;
  position: relative;
}
.book-spine::after {
  content: '';
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(0, 0, 0, 0.06);
}

/* ===== FUSION STYLE - Glass Warm Effect ===== */
.glass-warm {
  background: rgba(247, 245, 240, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(163, 145, 113, 0.15);
}

/* ===== FUSION STYLE - Card Active Press ===== */
.card-active {
  transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s;
}
.card-active:active {
  transform: scale(0.96);
}

/* ===== FUSION STYLE - Slide Up Panel ===== */
.slide-up {
  transform: translateY(100%);
  transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
}
.slide-up.active {
  transform: translateY(0);
}

/* ===== FUSION STYLE - Hero Card ===== */
.hero-card-fusion {
  position: relative;
  width: 100%;
  height: 420px;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(163, 145, 113, 0.15);
  overflow: hidden;
  cursor: pointer;
}
.hero-card-fusion .card-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #ebe6df 0%, #e1d9ce 100%);
}
.hero-card-fusion .card-content {
  position: relative;
  z-index: 10;
  padding: 24px;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.hero-card-fusion .card-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3em;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.hero-card-fusion .card-title {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--text-main);
}
.hero-card-fusion .card-book {
  position: absolute;
  bottom: 80px;
  right: -10px;
  width: 140px;
  height: 200px;
  background: #f8f6f2;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  transform: rotate(-4deg);
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #e5e0d8;
}
.hero-card-fusion .card-footer {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.hero-card-fusion .card-footer-title {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--text-main);
}
.hero-card-fusion .card-footer-author {
  font-size: 12px;
  color: var(--text-muted);
}
.hero-card-fusion .card-action {
  font-weight: 700;
  font-size: 13px;
  padding: 8px 20px;
  border-radius: 999px;
  background: var(--accent);
  color: white;
  border: none;
  cursor: pointer;
  transition: background 0.2s;
}
.hero-card-fusion .card-action:hover {
  background: var(--accent-hover);
}

/* ===== FUSION STYLE - Reading Text ===== */
.reading-text p {
  text-indent: 2em;
  margin-bottom: 1.5em;
  line-height: 2.2;
  letter-spacing: 1.5px;
}
.reading-text p:first-of-type::first-letter {
  font-size: 2.5em;
  font-weight: 700;
  float: left;
  margin-right: 4px;
  color: var(--accent);
  line-height: 1;
}

/* ===== FUSION STYLE - List Item ===== */
.list-item-fusion {
  display: flex;
  align-items: center;
  gap: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-light);
}
.list-item-fusion .item-cover {
  width: 60px;
  height: 85px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-medium);
  flex-shrink: 0;
}
.list-item-fusion .item-content {
  flex: 1;
}
.list-item-fusion .item-title {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 4px;
}
.list-item-fusion .item-meta {
  font-size: 12px;
  color: var(--text-muted);
}
.list-item-fusion .item-btn {
  font-weight: 700;
  font-size: 13px;
  padding: 6px 16px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s;
}
.list-item-fusion .item-btn-outline {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
}
.list-item-fusion .item-btn-outline:hover {
  background: var(--accent);
  color: white;
}
.list-item-fusion .item-btn-filled {
  background: var(--bg-base);
  border: 1px solid var(--border-medium);
  color: var(--text-muted);
}

.book-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--spacing-4);
  padding-bottom: var(--spacing-6);
}
.book-card {
  display: flex;
  flex-direction: column;
  background: var(--bg-base);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: all var(--t-normal);
}
.book-card:active {
  transform: scale(0.97);
}
.book-card-info {
  padding: var(--spacing-2);
}
.book-card-title {
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  color: var(--text-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.book-card-author {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: 2px;
}
.book-card-meta {
  display: flex;
  justify-content: space-between;
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: var(--spacing-1);
}

.settings-list {
  background: var(--bg-base);
  border-radius: var(--radius-lg);
  margin: 0 var(--spacing-4);
  overflow: hidden;
}
.settings-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-4);
  color: var(--text-dark);
  font-size: var(--text-base);
  border-bottom: 1px solid var(--color-border-light);
  cursor: pointer;
  transition: background var(--t-fast);
  text-decoration: none;
}
.settings-item:last-child {
  border-bottom: none;
}
.settings-item:hover {
  background: rgba(0,0,0,0.02);
}
.settings-item:active {
  background: rgba(0,0,0,0.04);
}
.settings-item span:first-child {
  font-size: 18px;
}
.settings-item span:nth-child(2) {
  flex: 1;
}

.toggle {
  position: relative;
  width: 48px;
  height: 28px;
}
.toggle input {
  opacity: 0;
  width: 0;
  height: 0;
}
.toggle-slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background: var(--color-border-strong);
  border-radius: 28px;
  transition: all var(--t-normal);
}
.toggle-slider::before {
  content: '';
  position: absolute;
  width: 22px;
  height: 22px;
  left: 3px;
  bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: all var(--t-normal);
  box-shadow: var(--shadow-xs);
}
.toggle input:checked + .toggle-slider {
  background: var(--accent);
}
.toggle input:checked + .toggle-slider::before {
  transform: translateX(20px);
}

/* ===== SPA VIEW SYSTEM ===== */
.view {
  display: none;
  opacity: 0;
  transition: opacity var(--t-silent);
}
.view.active {
  display: block;
  opacity: 1;
  animation: page-enter var(--t-silent) forwards;
}

/* Hero Books - 橫向排列的書籍展示 */
.hero-books {
  display: flex;
  justify-content: center;
  gap: var(--spacing-8);
  padding: var(--spacing-xl) var(--spacing-lg);
  flex-wrap: wrap;
}

.hero-book {
  display: flex;
  gap: var(--spacing-4);
  padding: var(--spacing-4);
  background: var(--bg-base);
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: all var(--t-normal);
  box-shadow: var(--shadow-xs);
}
.hero-book:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-md);
}
.hero-book:active {
  transform: scale(0.98);
}
.hero-book.second {
  opacity: 0.8;
  transform: scale(0.92);
}
.hero-book.second:hover {
  opacity: 1;
  transform: scale(0.94);
}

/* 書籍封面 - 垂直文字 */
.hero-book .book-cover {
  width: 80px;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #d8cfc4;
  border-radius: var(--radius-sm);
  writing-mode: vertical-rl;
  text-orientation: mixed;
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: var(--font-semibold);
  color: #fff;
  letter-spacing: 0.1em;
  box-shadow: -4px 8px 16px rgba(0, 0, 0, 0.08);
  position: relative;
  overflow: hidden;
}
.hero-book .book-cover::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: rgba(0, 0, 0, 0.15);
}
.hero-book .book-cover::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 50%);
}

.hero-book .book-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--spacing-1);
}
.hero-book .book-info h3 {
  font-size: var(--text-lg);
  font-weight: var(--font-semibold);
  color: var(--text-dark);
  font-family: var(--font-serif);
  margin: 0;
}
.hero-book .book-info p {
  font-size: var(--text-sm);
  color: var(--text-muted);
  margin: 0;
}

/* TOC View */
.toc-list {
  list-style: none;
  padding: 0 var(--spacing-lg);
  margin: 0;
}
.toc-list .toc-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-4);
  padding: var(--spacing-3) 0;
  border-bottom: 1px solid var(--color-border-light);
  cursor: pointer;
  transition: all var(--t-normal);
}
.toc-list .toc-item:hover {
  background: rgba(163, 145, 113, 0.08);
  padding-left: var(--spacing-2);
}
.toc-list .toc-item:active {
  background: rgba(163, 145, 113, 0.15);
}
.toc-list .toc-chapter {
  font-size: var(--text-sm);
  color: var(--text-muted);
  width: 24px;
  text-align: center;
}
.toc-list .toc-title {
  font-size: var(--text-base);
  color: var(--text-dark);
  font-family: var(--font-serif);
}

/* Back button for views */
.view-header {
  display: flex;
  align-items: center;
  padding: var(--spacing-3) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
  background: var(--bg-base);
}
.view-back {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--text-dark);
  cursor: pointer;
  transition: all var(--t-normal);
}
.view-back:active {
  transform: scale(0.95);
}
.view-title {
  flex: 1;
  font-size: var(--text-lg);
  font-weight: var(--font-semibold);
  color: var(--text-dark);
  font-family: var(--font-serif);
  text-align: center;
  padding-right: 32px;
}

[data-theme="night"] {
  --color-bg: #1a1a1a;
  --color-surface: #242420;
  --color-surface-glass: rgba(36, 36, 32, 0.95);
  --color-text-primary: #e8e6e0;
  --color-text-secondary: #a8a49c;
  --color-text-tertiary: #6b6964;
  --color-border-light: rgba(255, 255, 255, 0.04);
  --color-border: rgba(255, 255, 255, 0.08);
  --color-border-strong: rgba(255, 255, 255, 0.12);
  --shadow-xs: 2px 4px 8px rgba(0, 0, 0, 0.2);
  --shadow-sm: -4px 8px 16px rgba(0, 0, 0, 0.25);
  --shadow-md: -6px 12px 20px rgba(0, 0, 0, 0.3);
  --shadow-lg: -8px 16px 28px rgba(0, 0, 0, 0.35);
  --shadow-xl: -10px 20px 36px rgba(0, 0, 0, 0.4);
  --reader-bg: #1e1e1c;
  --reader-text: #e8e6e0;
}

[data-theme="sepia"] {
  --color-bg: #f5f0e8;
  --color-surface: #faf6ef;
  --color-surface-glass: rgba(250, 246, 239, 0.95);
  --color-text-primary: #4a4538;
  --color-text-secondary: #6b5f4f;
  --color-text-tertiary: #9b8b74;
  --color-border: #4a4538;
  --color-border-light: rgba(74, 69, 56, 0.08);
  --reader-bg: #f5f0e8;
  --reader-text: #4a4538;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
html {
  font-size: 16px;
  scroll-behavior: smooth;
  overscroll-behavior-y: contain;
}
body {
  font-family: var(--font-sans);
  background: #d8d4cd;
  color: var(--text-dark);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding: 0;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
}

.app-container {
  max-width: 400px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg-app);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

@media (min-width: 480px) {
  .app-container {
    min-height: 100vh;
    border-radius: 24px;
    overflow: hidden;
    margin: 8px auto;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
  }
}

.btn-press {
  transition: transform var(--t-fast), box-shadow var(--t-fast);
}
.btn-press:active {
  transform: scale(0.98);
  box-shadow: none;
}

@keyframes bookmark-bounce {
  0% { transform: scale(1); }
  30% { transform: scale(1.08); }
  60% { transform: scale(0.98); }
  100% { transform: scale(1); }
}
.btn-press.bookmark-active:active {
  animation: bookmark-bounce 300ms cubic-bezier(.4, 0, .2, 1);
}

.card-hover {
  transition: transform var(--t-normal), box-shadow var(--t-normal), opacity var(--t-normal);
}
.card-hover:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-card-hover);
  opacity: 0.95;
}

.scroll-snap { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
.scroll-snap > * { scroll-snap-align: start; }

@keyframes page-enter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-enter {
  animation: page-enter var(--t-silent) forwards;
}

.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: linear-gradient(to bottom, var(--bg-base) 0%, transparent 100%);
  padding-top: env(safe-area-inset-top);
  transition: transform var(--t-normal);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--spacing-4);
  height: 56px;
}
.logo {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
}
.logo svg {
  width: 32px;
  height: 32px;
}
.logo-text {
  font-size: var(--text-xl);
  font-weight: var(--font-semibold);
  letter-spacing: 0.05em;
  color: var(--text-dark);
  font-family: var(--font-serif);
}

.footer-nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding: 12px 32px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: space-around;
  transition: transform var(--t-normal);
}

/* Fusion Style Bottom Nav */
.footer-nav-fusion {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  padding: 12px 32px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: space-around;
  align-items: center;
}
.footer-nav-fusion .nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  padding: 4px 16px;
  border-radius: var(--radius-lg);
  transition: all 0.2s;
}
.footer-nav-fusion .nav-btn svg {
  width: 24px;
  height: 24px;
  margin-bottom: 6px;
  transition: transform 0.2s;
}
.footer-nav-fusion .nav-btn span {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
}
.footer-nav-fusion .nav-btn:active svg {
  transform: scale(0.85);
}
.footer-nav-fusion .nav-btn.inactive {
  color: var(--text-muted);
}
.footer-nav-fusion .nav-btn.active {
  color: var(--accent);
}

.footer-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: var(--text-xs);
  font-weight: var(--font-medium);
  color: var(--text-muted);
  padding: var(--spacing-2) var(--spacing-3);
  min-height: 44px;
  justify-content: center;
  border-radius: var(--radius-lg);
  transition: all var(--t-normal);
}
.footer-nav-item.active {
  color: var(--accent);
}
.footer-nav-item svg {
  width: 20px;
  height: 20px;
}
.footer-nav-item:hover {
  color: var(--accent);
}
.footer-nav-item:active {
  transform: scale(0.95);
}

/* Tab Navigation (App-style) */
.footer-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: var(--spacing-2) var(--spacing-4);
  background: transparent;
  border: none;
  border-radius: var(--radius-lg);
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all var(--t-normal);
  min-width: 64px;
  min-height: 44px;
}
.footer-tab svg {
  width: 22px;
  height: 22px;
  transition: transform var(--t-fast);
}
.footer-tab span {
  font-size: 10px;
  letter-spacing: 0.5px;
}
.footer-tab:hover {
  color: var(--accent);
  background: rgba(163, 145, 113, 0.08);
}
.footer-tab.active {
  color: var(--accent);
}
.footer-tab.active svg {
  transform: scale(1.1);
}
.footer-tab.inactive {
  color: var(--text-muted);
}
.footer-tab:active {
  transform: scale(0.95);
}

.home-hero {
  position: relative;
  margin: 56px 0 0;
  padding: var(--spacing-12) var(--spacing-6);
  background: linear-gradient(180deg, var(--bg-base) 0%, var(--bg-outer) 100%);
  overflow: hidden;
  min-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-content {
  position: relative;
  z-index: 1;
  text-align: center;
  animation: hero-enter 0.6s ease-out;
}

@keyframes hero-enter {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-badge {
  display: inline-block;
  padding: var(--spacing-2) var(--spacing-4);
  background: var(--accent);
  color: #fff;
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  margin-bottom: var(--spacing-4);
  border-radius: var(--radius-full);
  letter-spacing: 0.1em;
  opacity: 0.9;
}

.hero-search-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-3);
  padding: var(--spacing-4) var(--spacing-6);
  background: var(--bg-base);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-xl);
  color: var(--text-muted);
  font-size: var(--text-base);
  font-weight: var(--font-normal);
  margin-bottom: var(--spacing-6);
  max-width: 400px;
  transition: all var(--t-normal);
  box-shadow: var(--shadow-xs);
  text-decoration: none;
}
.hero-search-btn:hover {
  box-shadow: var(--shadow-sm);
  transform: translateY(-2px);
  color: var(--text-dark);
  border-color: var(--accent);
}
.hero-search-btn:active {
  transform: scale(0.98);
}

.hero-stats {
  display: flex;
  gap: var(--spacing-6);
  justify-content: center;
}
.hero-stat {
  text-align: center;
  flex: 1;
  padding: var(--spacing-4) var(--spacing-6);
  background: var(--bg-base);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-lg);
  transition: all var(--t-normal);
  max-width: 160px;
}
.hero-stat:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-sm);
}
.hero-stat-num {
  display: block;
  font-size: var(--text-2xl);
  font-weight: var(--font-semibold);
  color: var(--text-dark);
  font-family: var(--font-serif);
  font-variant-numeric: tabular-nums;
}
.hero-stat-label {
  font-size: var(--text-xs);
  color: var(--text-muted);
  font-weight: var(--font-normal);
  letter-spacing: 0.05em;
  margin-top: var(--spacing-1);
}

@media (prefers-reduced-motion: reduce) {
  .home-hero, .hero-content, .hero-stat {
    animation: none;
    transition: none;
  }
  .hero-stat:hover {
    transform: none;
  }
}

@media (max-width: 768px) {
  .hero-stats { gap: var(--spacing-4); }
  .hero-stat { padding: var(--spacing-3); }
  .hero-stat-num { font-size: var(--text-xl); }
}

/* ═══════════════════════════════════════════════════════════
   SECTION LAYOUT
   ═══════════════════════════════════════════════════════════ */

.home-section {
  padding: 24px 0 0;
  animation: section-enter 0.5s ease-out both;
}
.home-section:nth-child(2) { animation-delay: 0.05s; }
.home-section:nth-child(3) { animation-delay: 0.1s; }
.home-section:nth-child(4) { animation-delay: 0.15s; }
.home-section:nth-child(5) { animation-delay: 0.2s; }

@keyframes section-enter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.home-section-last {
  padding-bottom: 80px;
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--spacing-lg);
  margin-bottom: var(--spacing-md);
}
.section-title {
  font-size: 20px;
  font-weight: var(--font-semibold);
  color: var(--text-dark);
  letter-spacing: 0.02em;
  margin: 0;
  padding: 0;
  font-family: var(--font-serif);
}

.section-divider {
  height: 1px;
  margin: 0 var(--spacing-lg);
  background: var(--color-border-light);
}

/* ═══════════════════════════════════════════════════════════
   FEATURED CARDS - Neo-Brutalism
   ═══════════════════════════════════════════════════════════ */

.featured-scroll {
  display: flex;
  gap: var(--spacing-4);
  overflow-x: auto;
  padding: 0 var(--spacing-4) var(--spacing-4);
  padding-right: calc(var(--spacing-4) + 60px);
  scrollbar-width: none;
  scroll-snap-type: x mandatory;
}
.featured-scroll::-webkit-scrollbar { display:none; }

.featured-card {
  flex-shrink: 0;
  width: 140px;
  scroll-snap-align: start;
  background: var(--bg-base);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-xs);
  transition: all var(--t-normal);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: card-enter 0.5s ease-out both;
}
.featured-card:nth-child(1) { animation-delay: 0.05s; }
.featured-card:nth-child(2) { animation-delay: 0.1s; }
.featured-card:nth-child(3) { animation-delay: 0.15s; }
.featured-card:nth-child(4) { animation-delay: 0.2s; }
.featured-card:nth-child(5) { animation-delay: 0.25s; }
.featured-card:nth-child(6) { animation-delay: 0.3s; }

@keyframes card-enter {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.featured-card:active {
  transform: scale(0.98);
}

@media (hover: hover) {
  .featured-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-md);
  }
  .featured-card:hover .css-book-cover {
    transform: scale(1.02);
  }
}

.book-cover-wrapper {
  position: relative;
  display: block;
  width: 140px;
}

.book-cover-wrapper .css-book-cover {
  display: block;
  transition: transform var(--t-normal);
}

.status-badge {
  position: absolute;
  top: var(--spacing-2);
  right: var(--spacing-2);
  padding: 2px 6px;
  font-size: 10px;
  font-weight: var(--font-medium);
  color: #fff;
  border-radius: var(--radius-sm);
  z-index: 2;
}

.status-badge.status-ongoing {
  background: var(--accent);
}
.status-badge.status-done {
  background: var(--color-success);
}

.featured-info {
  padding: var(--spacing-2) var(--spacing-3);
}
.featured-title {
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  color: var(--text-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.featured-meta {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
}
.featured-rating {
  font-weight: var(--font-bold);
}

.rank-tabs {
  display: flex;
  gap: var(--spacing-2);
  padding: 0 var(--spacing-lg);
  margin-bottom: var(--spacing-md);
}
.rank-tab {
  padding: var(--spacing-2) var(--spacing-4);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-full);
  background: transparent;
  font-size: var(--text-sm);
  font-weight: var(--font-normal);
  color: var(--text-muted);
  cursor: pointer;
  transition: all var(--t-normal);
}
.rank-tab.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.rank-tab:active {
  transform: scale(0.95);
}

.rank-list { padding: 0; }
.rank-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: var(--spacing-3) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
  transition: all var(--t-normal);
  animation: rank-enter 0.4s ease-out both;
}
.rank-item:nth-child(1) { animation-delay: 0.02s; }
.rank-item:nth-child(2) { animation-delay: 0.04s; }
.rank-item:nth-child(3) { animation-delay: 0.06s; }
.rank-item:nth-child(4) { animation-delay: 0.08s; }
.rank-item:nth-child(5) { animation-delay: 0.1s; }
.rank-item:nth-child(6) { animation-delay: 0.12s; }
.rank-item:nth-child(7) { animation-delay: 0.14s; }
.rank-item:nth-child(8) { animation-delay: 0.16s; }
.rank-item:nth-child(9) { animation-delay: 0.18s; }
.rank-item:nth-child(10) { animation-delay: 0.2s; }

@keyframes rank-enter {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}
.rank-item:active {
  background: var(--color-border-light);
}
@media (hover: hover) {
  .rank-item:hover {
    background: rgba(163, 145, 113, 0.08);
  }
}
.rank-num {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: var(--font-medium);
  flex-shrink: 0;
  background: var(--color-surface);
  border: 2px solid var(--color-border);
  color: var(--color-text-secondary);
  font-variant-numeric: tabular-nums;
}
.rank-num.rank-top {
  background: var(--color-primary);
  color: #fff;
  border-color: var(--color-border);
  box-shadow: var(--shadow-xs);
}
.css-book-cover-mini {
  margin: 0;
}
.rank-info { flex:1; min-width:0; }
.rank-title {
  font-size: 14px;
  font-weight: var(--font-medium);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rank-sub {
  font-size: 11px;
  color: var(--color-text-secondary);
  margin-top: 2px;
}
.rank-score {
  font-size: 14px;
  font-weight: var(--font-extrabold);
  font-variant-numeric: tabular-nums;
}

@media (prefers-reduced-motion: reduce) {
  .rank-item {
    animation: none;
    transition: none;
    transform: none !important;
  }
}

.cat-section {
  padding: 24px 0;
}
.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--spacing-3);
  padding: 0 var(--spacing-lg);
}
.cat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-2);
  padding: var(--spacing-4);
  background: var(--bg-base);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-lg);
  transition: all var(--t-normal);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.cat-item:active {
  transform: scale(0.98);
}
@media (hover: hover) {
  .cat-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
    border-color: var(--accent);
  }
}
.cat-item.featured {
  grid-column: span 2;
  grid-row: span 2;
  padding: var(--spacing-6);
}
.cat-icon { font-size: 24px; }
.cat-item.featured .cat-icon { font-size: 40px; }
.cat-name {
  font-size: var(--text-xs);
  font-weight: var(--font-normal);
  color: var(--text-muted);
  text-align: center;
}
.cat-item.featured .cat-name {
  font-size: var(--text-base);
  color: var(--text-dark);
}

@media (max-width: 768px) {
  .cat-grid { grid-template-columns: repeat(4, 1fr); gap: var(--spacing-2); }
  .cat-item { padding: var(--spacing-3); }
  .cat-icon { font-size: 20px; }
  .cat-item.featured { grid-column: span 2; grid-row: span 1; padding: var(--spacing-4); }
}

@media (max-width: 360px) {
  .cat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .cat-item.featured {
    grid-column: span 2;
    grid-row: span 1;
  }
}

/* ═══════════════════════════════════════════════════════════
   LATEST UPDATES
   ═══════════════════════════════════════════════════════════ */

.latest-list {
  display: flex;
  flex-direction: column;
  padding: 0;
}
.latest-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-3) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
  transition: all var(--t-normal);
}
.latest-item:active {
  background: rgba(163, 145, 113, 0.08);
}
@media (hover: hover) {
  .latest-item:hover {
    background: rgba(163, 145, 113, 0.08);
  }
}
.latest-info { flex: 1; min-width: 0; }
.latest-title {
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  color: var(--text-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.latest-chapter {
  font-size: var(--text-xs);
  color: var(--text-muted);
  margin-top: 2px;
}
.latest-time {
  font-size: var(--text-xs);
  color: var(--text-muted);
  flex-shrink: 0;
}

.css-book-cover {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #d8cfc4;
  border-radius: var(--radius-sm);
  overflow: hidden;
  font-family: var(--font-serif);
  box-shadow: -6px 12px 20px rgba(0, 0, 0, 0.06);
}
.css-book-cover::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: rgba(0, 0, 0, 0.15);
  z-index: 1;
}
.css-book-cover::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 40%, rgba(0,0,0,0.05) 100%);
  pointer-events: none;
}
.cover-decorations {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.cover-content {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: var(--spacing-4);
  color: #fff;
}
.cover-title {
  font-size: 18px;
  font-weight: var(--font-semibold);
  color: #fff;
  line-height: 1.4;
  letter-spacing: 0.05em;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
}
.cover-author {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.85);
  margin-top: var(--spacing-2);
  font-weight: var(--font-normal);
  letter-spacing: 0.02em;
}
.cover-tag {
  display: inline-block;
  padding: 2px 8px;
  background: rgba(0, 0, 0, 0.25);
  color: #fff;
  font-size: 10px;
  font-weight: var(--font-normal);
  border-radius: var(--radius-sm);
  margin-bottom: var(--spacing-2);
  letter-spacing: 0.05em;
}
.cover-synopsis {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.75);
  line-height: 1.5;
  margin-top: var(--spacing-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.css-book-cover-mini {
  background: #d8cfc4;
  border: none;
}
.css-book-cover-mini .cover-title {
  font-size: 14px;
}

/* ═══════════════════════════════════════════════════════════
   BOOK DETAIL PAGE
   ═══════════════════════════════════════════════════════════ */

.book-detail {
  padding-top: 56px;
}
.detail-hero {
  position: relative;
  display: flex;
  gap: var(--spacing-lg);
  padding: var(--spacing-lg);
  background: var(--bg-base);
  border-bottom: 1px solid var(--color-border-light);
}
.detail-cover {
  flex-shrink: 0;
}
.detail-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--spacing-2);
}
.detail-title {
  font-size: var(--text-2xl);
  font-weight: var(--font-semibold);
  color: var(--text-dark);
  letter-spacing: 0.02em;
  font-family: var(--font-serif);
}
.detail-author {
  font-size: var(--text-base);
  color: var(--text-muted);
  font-weight: var(--font-normal);
}
.detail-meta {
  display: flex;
  gap: var(--spacing-lg);
  font-size: var(--text-sm);
  color: var(--text-muted);
}

.sticky-cta {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 25;
  background: linear-gradient(to top, var(--bg-base) 0%, transparent 100%);
  padding: var(--spacing-md) var(--spacing-lg);
  padding-bottom: calc(var(--spacing-md) + env(safe-area-inset-bottom));
  display: flex;
  gap: var(--spacing-md);
}
.btn-primary {
  flex: 1;
  padding: var(--spacing-md);
  border-radius: var(--radius-lg);
  color: #fff;
  text-align: center;
  font-weight: var(--font-medium);
  font-size: var(--text-base);
  min-height: 48px;
  background: var(--accent);
  border: none;
  transition: all var(--t-normal);
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-primary:hover {
  box-shadow: var(--shadow-sm);
  transform: translateY(-2px);
}
.btn-primary:active {
  transform: scale(0.98);
}
.btn-secondary {
  padding: var(--spacing-md) var(--spacing-xl);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border-light);
  color: var(--text-dark);
  background: var(--bg-base);
  font-weight: var(--font-medium);
  min-height: 48px;
  transition: all var(--t-normal);
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-secondary:hover {
  box-shadow: var(--shadow-sm);
  transform: translateY(-2px);
  border-color: var(--accent);
}
.btn-secondary:active {
  transform: scale(0.98);
}

.synopsis {
  padding: 0 var(--spacing-lg);
  margin-bottom: var(--spacing-xl);
}
.synopsis-text {
  font-size: var(--text-base);
  color: var(--text-muted);
  line-height: 1.8;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.synopsis-text.expanded {
  -webkit-line-clamp: unset;
  overflow: visible;
}
.synopsis-toggle {
  font-size: var(--text-sm);
  margin-top: var(--spacing-xs);
  color: var(--accent);
}

/* TOC */
.toc {
  padding: 0 var(--spacing-lg) 100px;
  position: relative;
}
.toc-title {
  font-size: var(--text-lg);
  font-weight: var(--font-semibold);
  color: var(--text-dark);
  margin-bottom: var(--spacing-md);
  letter-spacing: 0.02em;
  font-family: var(--font-serif);
}
.toc-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-3) 0;
  border-bottom: 1px solid var(--color-border-light);
  transition: all var(--t-normal);
}
.toc-item:active {
  background: rgba(163, 145, 113, 0.08);
}
@media (hover: hover) {
  .toc-item:hover {
    padding-left: var(--spacing-2);
    background: rgba(163, 145, 113, 0.08);
  }
}
.toc-chapter {
  font-size: var(--text-sm);
  font-weight: var(--font-normal);
  color: var(--text-dark);
}
.toc-words {
  font-size: var(--text-xs);
  color: var(--text-muted);
}

/* ═══════════════════════════════════════════════════════════
   READER PAGE
   ═══════════════════════════════════════════════════════════ */

.reader-page {
  min-height: 100vh;
}
.reader-immersive {
  background: var(--reader-bg);
  color: var(--reader-text);
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  position: relative;
  transition: background var(--t-slow), color var(--t-slow);
}

.reader-progress {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--color-border-light);
  z-index: 101;
}
.reader-progress-bar {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s ease;
  width: 0%;
}

.reader-topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: linear-gradient(to bottom, var(--bg-base) 0%, transparent 100%);
  padding: var(--spacing-2) var(--spacing-3);
  padding-top: calc(var(--spacing-2) + env(safe-area-inset-top));
  transition: transform var(--t-normal);
}
.reader-topbar.hidden {
  transform: translateY(-100%);
}
.reader-topbar-inner {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  max-width: 900px;
  margin: 0 auto;
  min-height: 36px;
}
.reader-topbar-back {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: var(--radius-md);
  background: rgba(255, 255, 255, 0.6);
  color: var(--text-dark);
  flex-shrink: 0;
  transition: all var(--t-normal);
}
.reader-topbar-back:active {
  transform: scale(0.95);
}
.reader-topbar-title {
  font-size: 13px;
  font-weight: var(--font-medium);
  color: var(--text-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
  font-family: var(--font-sans);
}
.reader-topbar-breadcrumb {
  display: none;
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.reader-bottombar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: linear-gradient(to top, var(--bg-base) 0%, transparent 100%);
  padding: var(--spacing-2) var(--spacing-3);
  padding-bottom: calc(var(--spacing-2) + env(safe-area-inset-bottom));
  transition: transform var(--t-normal);
}
.reader-bottombar.hidden {
  transform: translateY(100%);
}
.reader-bottombar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-2);
  max-width: 900px;
  margin: 0 auto;
}
.reader-bottombar-tools {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: var(--spacing-1);
  padding: var(--spacing-2);
  min-width: 40px;
  min-height: 40px;
  justify-content: center;
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-md);
  background: var(--bg-base);
  color: var(--text-dark);
  font-size: 0;
  font-weight: var(--font-medium);
  text-decoration: none;
  transition: all var(--t-normal);
  white-space: nowrap;
  flex-shrink: 0;
}
.nav-btn svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}
.nav-btn .nav-label {
  display: none;
}
.nav-btn:active {
  transform: scale(0.95);
}
.nav-btn.disabled {
  opacity: 0.3;
  pointer-events: none;
}

.tool-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-md);
  background: var(--bg-base);
  color: var(--text-dark);
  font-size: 0;
  font-weight: var(--font-medium);
  cursor: pointer;
  transition: all var(--t-normal);
  white-space: nowrap;
  flex-shrink: 0;
}
.tool-btn svg {
  width: 18px;
  height: 18px;
}
.tool-btn span {
  display: none;
}
.tool-btn:active {
  transform: scale(0.95);
}

.reader-content {
  padding: var(--spacing-8) var(--spacing-lg);
  padding-top: 80px;
  padding-bottom: 120px;
  font-family: var(--font-serif);
  font-size: var(--reader-font-size);
  line-height: var(--reader-line-height);
  letter-spacing: var(--reader-letter-spacing);
  max-width: 680px;
  margin: 0 auto;
  text-align: justify;
}
.reader-content h1 {
  font-size: var(--text-2xl);
  font-weight: var(--font-semibold);
  margin-bottom: var(--spacing-6);
  color: var(--text-dark);
  letter-spacing: 0.05em;
  text-align: center;
  font-family: var(--font-serif);
}
.reader-content p {
  margin-bottom: var(--reader-paragraph-spacing);
  text-indent: var(--reader-text-indent);
}

@media (min-width: 768px) {
  .reader-topbar {
    padding: var(--spacing-3) var(--spacing-6);
  }
  .reader-bottombar {
    padding: var(--spacing-3) var(--spacing-6);
  }
  .reader-topbar-title {
    display: none;
  }
  .reader-topbar-breadcrumb {
    display: block;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .reader-topbar-back {
    width: 36px;
    height: 36px;
  }
  .nav-btn {
    padding: var(--spacing-2) var(--spacing-3);
    font-size: var(--text-sm);
    min-width: auto;
    gap: var(--spacing-1);
  }
  .nav-btn .nav-label {
    display: inline;
  }
  .nav-btn svg {
    width: 16px;
    height: 16px;
  }
  .tool-btn {
    width: auto;
    height: auto;
    padding: var(--spacing-2) var(--spacing-3);
    font-size: var(--text-xs);
    gap: var(--spacing-1);
  }
  .tool-btn span {
    display: inline;
  }
  .tool-btn svg {
    width: 16px;
    height: 16px;
  }
  .reader-content {
    max-width: 720px;
    padding-left: var(--spacing-8);
    padding-right: var(--spacing-8);
    padding-top: 100px;
    padding-bottom: 100px;
    font-size: 20px;
  }
  .reader-page {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
}

@media (min-width: 1024px) {
  .reader-content {
    max-width: 760px;
    font-size: 20px;
    line-height: 2.4;
  }
  .reader-topbar-inner {
    max-width: 820px;
  }
  .reader-bottombar-inner {
    max-width: 820px;
  }
}

/* Sheet overlay / bottom sheet */
.sheet-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--motion-fast);
}
.sheet-overlay.active {
  opacity: 1;
  pointer-events: auto;
}
.sheet-content {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--color-surface);
  border-top: 3px solid var(--color-border);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform var(--motion-smooth);
}
.sheet-overlay.active .sheet-content {
  transform: translateY(0);
}
.sheet-handle {
  width: 36px;
  height: 4px;
  background: var(--color-border);
  border-radius: var(--radius-full);
  margin: var(--spacing-3) auto;
  opacity: 0.3;
}
.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-3) var(--spacing-4);
  border-bottom: 2px solid var(--color-border-light);
}
.sheet-header h3 {
  font-size: var(--text-lg);
  font-weight: var(--font-extrabold);
  color: var(--color-text-primary);
}
.sheet-body {
  padding: var(--spacing-4);
  overflow-y: auto;
  flex: 1;
}

/* Sheet TOC items */
.sheet-body .toc-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-3) 0;
  border-bottom: 2px solid var(--color-border-light);
  text-decoration: none;
  color: var(--color-text-primary);
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  transition: all var(--motion-fast);
}
.sheet-body .toc-item:active {
  transform: translate(2px, 2px);
}
@media (hover: hover) {
  .sheet-body .toc-item:hover {
    padding-left: var(--spacing-2);
  }
}

/* Settings */
.setting-group {
  margin-bottom: var(--spacing-4);
}
.setting-label {
  font-size: var(--text-sm);
  font-weight: var(--font-bold);
  color: var(--color-text-primary);
  margin-bottom: var(--spacing-2);
}
.setting-row {
  display: flex;
  gap: var(--spacing-2);
}
.setting-btn {
  flex: 1;
  padding: var(--spacing-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  font-weight: var(--font-bold);
  cursor: pointer;
  transition: all var(--motion-fast);
  text-align: center;
}
.setting-btn:active {
  transform: translate(2px, 2px);
}

/* TTS */
.tts-play-btn {
  width: 64px;
  height: 64px;
  border: 3px solid var(--color-border);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin: 0 auto var(--spacing-4);
  box-shadow: var(--shadow-sm);
  transition: all var(--motion-fast);
}
.tts-play-btn:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}
.tts-progress-wrap {
  margin-bottom: var(--spacing-4);
  padding: 0 var(--spacing-2);
}
.tts-range-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 12px;
  background: var(--color-border-light);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-full);
  outline: none;
  cursor: pointer;
  transition: box-shadow var(--motion-fast);
}
.tts-range-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 24px;
  height: 24px;
  background: var(--color-primary);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-xs);
  cursor: grab;
  transition: transform var(--motion-fast), box-shadow var(--motion-fast);
}
.tts-range-slider::-webkit-slider-thumb:active {
  cursor: grabbing;
  transform: scale(1.15);
  box-shadow: var(--shadow-sm);
}
.tts-range-slider::-moz-range-thumb {
  width: 24px;
  height: 24px;
  background: var(--color-primary);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-xs);
  cursor: grab;
  transition: transform var(--motion-fast), box-shadow var(--motion-fast);
}
.tts-range-slider::-moz-range-thumb:active {
  cursor: grabbing;
  transform: scale(1.15);
  box-shadow: var(--shadow-sm);
}
.tts-range-slider::-moz-range-track {
  height: 12px;
  background: var(--color-border-light);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-full);
}
.tts-progress-label {
  display: flex;
  justify-content: center;
  gap: var(--spacing-1);
  font-size: var(--text-xs);
  color: var(--color-text-tertiary);
  margin-top: var(--spacing-2);
  font-weight: var(--font-medium);
}
.tts-control {
  max-width: 300px;
  margin: 0 auto;
}
.tts-label {
  display: flex;
  justify-content: space-between;
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  color: var(--color-text-secondary);
}
.tts-toggle-group {
  display: flex;
  gap: 8px;
}
.tts-toggle-btn {
  flex: 1;
  padding: var(--spacing-3) var(--spacing-4);
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-md);
  background: var(--color-bg-primary, #fff);
  color: var(--color-text-secondary, #666);
  cursor: pointer;
  transition: all var(--motion-fast);
}
.tts-toggle-btn:hover {
  border-color: var(--accent-default, #3B82F6);
}
.tts-toggle-btn.active {
  background: var(--accent-default, #3B82F6);
  color: #fff;
  border-color: var(--accent-default, #3B82F6);
}
[data-theme="night"] .tts-toggle-btn,
[data-theme="sepia"] .tts-toggle-btn {
  background-color: var(--color-bg-primary);
  color: var(--color-text-primary);
  border-color: var(--color-border);
}

/* TTS paragraph highlight */
.reader-content p[data-tts-idx].tts-active {
  background: rgba(255, 107, 0, 0.08);
  border-left: 3px solid var(--color-primary);
  padding-left: var(--spacing-3);
  transition: all var(--motion-fast);
}

/* ═══════════════════════════════════════════════════════════
   SEARCH PAGE
   ═══════════════════════════════════════════════════════════ */

.search-hero {
  padding: 80px var(--spacing-lg) var(--spacing-lg);
  text-align: center;
  background: linear-gradient(180deg, var(--bg-base) 0%, var(--bg-outer) 100%);
}
.search-input-wrapper {
  position: relative;
  max-width: 500px;
  margin: 0 auto;
}
.search-input {
  width: 100%;
  padding: var(--spacing-4) var(--spacing-5);
  padding-left: 48px;
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-xl);
  background: var(--bg-base);
  font-size: var(--text-base);
  color: var(--text-dark);
  box-shadow: var(--shadow-xs);
  outline: none;
  transition: all var(--t-normal);
}
.search-input:focus {
  box-shadow: var(--shadow-sm);
  border-color: var(--accent);
}
.search-input::placeholder {
  color: var(--text-muted);
}
.search-icon {
  position: absolute;
  left: var(--spacing-4);
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════
   CATEGORY PAGE
   ═══════════════════════════════════════════════════════════ */

.cat-header {
  padding-top: 56px;
  background: linear-gradient(180deg, var(--bg-base) 0%, var(--bg-outer) 100%);
}
.cat-header-inner {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-3) var(--spacing-4);
}
.cat-header-title {
  font-size: var(--text-xl);
  font-weight: var(--font-extrabold);
  color: #fff;
}
.cat-header-back {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: var(--radius-md);
  background: transparent;
  color: #fff;
  cursor: pointer;
}

.book-list {
  padding: var(--spacing-4) 0;
}
.book-list-item {
  display: flex;
  gap: var(--spacing-4);
  padding: var(--spacing-4) var(--spacing-lg);
  border-bottom: 2px solid var(--color-border-light);
  transition: all var(--motion-fast);
}
.book-list-item:active {
  background: var(--color-border-light);
  transform: translate(2px, 2px);
}
@media (hover: hover) {
  .book-list-item:hover {
    background: var(--color-border-light);
  }
}
.book-list-cover {
  flex-shrink: 0;
}
.book-list-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.book-list-title {
  font-size: var(--text-base);
  font-weight: var(--font-bold);
  color: var(--color-text-primary);
  margin-bottom: 4px;
}
.book-list-meta {
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
}
.book-list-tags {
  display: flex;
  gap: var(--spacing-2);
  margin-top: var(--spacing-2);
}
.tag {
  display: inline-block;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: var(--font-bold);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text-secondary);
}

/* ═══════════════════════════════════════════════════════════
   LEGAL PAGES
   ═══════════════════════════════════════════════════════════ */

          <div class="tts-progress-wrap">
            <input type="range" min="0" max="100" value="0" step="1" id="tts-range" class="tts-range-slider" oninput="seekTTSRange(this.value)" onchange="seekTTSRange(this.value)" ontouchstart="seekTTSRange(this.value)" ontouchmove="seekTTSRange(this.value)" ontouchend="seekTTSRange(this.value)" aria-label="朗讀進度拖曳條">

            <div class="tts-label"><span>音高</span><span id="tts-pitch-val">1.0</span></div>
            <input type="range" min="0.5" max="2" step="0.1" value="1" id="tts-pitch" oninput="setTTSPitch(this.value)" style="margin:8px 0" aria-label="調整朗讀音高">

    <script>
    (function(){
      var uiVisible=true;
      var ttsPlaying=false;
      var ttsUtterance=null;
      var ttsCurrentIdx=0;
      var ttsCharOffset=0;
      
      window.openSheet=function(id){document.getElementById(id).classList.add('active')};
      window.closeSheet=function(id){document.getElementById(id).classList.remove('active')};
      
      // Bind toolbar button clicks
      document.getElementById('tool-btn-toc').onclick=function(){window.openSheet('toc-sheet')};
      document.getElementById('tool-btn-settings').onclick=function(){window.openSheet('settings-sheet')};
      document.getElementById('tool-btn-tts').onclick=function(){window.openSheet('tts-sheet')};

      window.setTheme=function(t){
        if(t==='light')document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme',t);
        try{localStorage.setItem('dn_theme',t)}catch(e){}
      };

      window.setFontSize=function(v){
        document.getElementById('reader-content').style.fontSize=v+'px';
        var fv=document.getElementById('font-size-val');
        if(fv)fv.textContent=v+'px';
        try{localStorage.setItem('dn_fontsize',v)}catch(e){}
      };

      window.setFont=function(t){
        var el=document.getElementById('reader-content');
        if(t==='serif')el.style.fontFamily="'PingFang TC','Microsoft JhengHei',Georgia,serif";
        else el.style.fontFamily="system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif";
        try{localStorage.setItem('dn_font',t)}catch(e){}
      };

      window.toggleTTS=function(){
        if(ttsPlaying){speechSynthesis.cancel();ttsPlaying=false;ttsCurrentIdx=0;updateTTSIcon();updateTTSProgress(0)}
        else{var paras=document.querySelectorAll('#reader-content p[data-tts-idx]');if(!paras.length)return;speakFrom(ttsCurrentIdx)}
      };

      window.updateTTSIcon=function(){
        var pi=document.getElementById('tts-play-icon');
        var pa=document.getElementById('tts-pause-icon');
        if(pi)pi.classList.toggle('hidden',ttsPlaying);
        if(pa)pa.classList.toggle('hidden',!ttsPlaying)
      };

      window.setTTSRate=function(v){
        document.getElementById('tts-rate-val').textContent=parseFloat(v).toFixed(1)+'x';
        if(ttsUtterance)ttsUtterance.rate=parseFloat(v)
      };

      window.setTTSPitch=function(v){
        document.getElementById('tts-pitch-val').textContent=parseFloat(v).toFixed(1);
        if(ttsUtterance)ttsUtterance.pitch=parseFloat(v)
      };

      window.seekTTSRange=function(val){
        var pct=parseInt(val)/100;
        var paras=document.querySelectorAll('#reader-content p[data-tts-idx]');
        var total=paras.length;
        if(!total)return;
        var targetIdx=Math.min(Math.floor(pct*total),total-1);
        if(targetIdx<0)targetIdx=0;
        if(ttsPlaying)speakFrom(targetIdx);
        else{ttsCurrentIdx=targetIdx;updateTTSProgress(targetIdx/(total-1));highlightParagraph(targetIdx)}
      };

      function speakFrom(idx){
        speechSynthesis.cancel();
        var paras=document.querySelectorAll('#reader-content p[data-tts-idx]');
        if(idx<0||idx>=paras.length){ttsPlaying=false;ttsCurrentIdx=0;ttsCharOffset=0;updateTTSIcon();updateTTSProgress(0);clearTTSHighlight();return}
        ttsCurrentIdx=idx;
        ttsCharOffset=0;
        var txt='';
        for(var i=idx;i<paras.length;i++){txt+=paras[i].textContent+' '}
        ttsUtterance=new SpeechSynthesisUtterance(txt);
        ttsUtterance.lang='zh-TW';
        var r=document.getElementById('tts-rate');
        var p=document.getElementById('tts-pitch');
        if(r)ttsUtterance.rate=parseFloat(r.value);
        if(p)ttsUtterance.pitch=parseFloat(p.value);
        ttsUtterance.onend=function(){
          ttsPlaying=false;
          ttsCurrentIdx=0;
          ttsCharOffset=0;
          updateTTSIcon();
          updateTTSProgress(0);
          clearTTSHighlight();
          var rng=document.getElementById('tts-range');
          if(rng)rng.value=0
        };
        ttsUtterance.onboundary=function(ev){
          if(ev.name==='word'||ev.name==='sentence'){
            var charPos=ev.charIndex;
            var before=0;
            var done=idx;
            for(var j=idx;j<paras.length;j++){
              var plen=paras[j].textContent.length;
              if(charPos<before+plen+1){done=j;ttsCharOffset=charPos-before;break}
              before+=plen+1
            }
            if(done!==ttsCurrentIdx){ttsCurrentIdx=done;highlightParagraph(done)}
            var pct=(done-idx)/(paras.length-idx);
            updateTTSProgress(pct);
            var rng=document.getElementById('tts-range');
            if(rng)rng.value=Math.round(pct*100)
          }
        };
        speechSynthesis.speak(ttsUtterance);
        ttsPlaying=true;
        updateTTSIcon();
        updateTTSProgress(0);
        highlightParagraph(idx);
        var rng=document.getElementById('tts-range');
        if(rng)rng.value=0
      }

      function highlightParagraph(idx){
        var paras=document.querySelectorAll('#reader-content p[data-tts-idx]');
        paras.forEach(function(p){p.classList.remove('tts-active')});
        if(idx>=0&&idx<paras.length){
          var el=paras[idx];
          el.classList.add('tts-active');
          el.scrollIntoView({behavior:'smooth',block:'center'})
        }
      }

      function clearTTSHighlight(){
        document.querySelectorAll('#reader-content p[data-tts-idx].tts-active').forEach(function(p){p.classList.remove('tts-active')})
      }

      function updateTTSProgress(pct){
        var fill=document.getElementById('tts-progress-fill');
        if(fill)fill.style.width=Math.max(0,Math.min(100,pct*100))+'%';
        var curEl=document.getElementById('tts-current-para');
        var totEl=document.getElementById('tts-total-para');
        if(curEl)curEl.textContent=ttsCurrentIdx+1;
        if(totEl)totEl.textContent=document.querySelectorAll('#reader-content p[data-tts-idx]').length
      }

      // Restore saved state
      (function(){
        try{
          var p=JSON.parse(localStorage.getItem('dn_progress')||'{}');
          var k='spirit-blade';
          if(p[k]&&p[k].chapter==='ch-1'&&p[k].scroll){
            setTimeout(function(){window.scrollTo(0,p[k].scroll)},100)
          }
          var theme=localStorage.getItem('dn_theme');
          if(theme&&theme!=='light')document.documentElement.setAttribute('data-theme',theme);
          var fs=localStorage.getItem('dn_fontsize');
          if(fs){
            document.getElementById('reader-content').style.fontSize=fs+'px';
            var fv=document.getElementById('font-size-val');
            if(fv)fv.textContent=fs+'px';
            var fr=document.getElementById('font-size-range');
            if(fr)fr.value=fs
          }
          var font=localStorage.getItem('dn_font');
          if(font){
            var el=document.getElementById('reader-content');
            if(font==='serif')el.style.fontFamily="'PingFang TC','Microsoft JhengHei',Georgia,serif";
            else el.style.fontFamily="system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif"
          }
        }catch(e){}
      })();

      // Scroll progress
      var _st=null;
      window.addEventListener('scroll',function(){
        var pb=document.getElementById('reader-progress-bar');
        if(pb){
          var h=document.documentElement.scrollHeight-window.innerHeight;
          pb.style.width=h>0?Math.min(window.scrollY/h*100,100)+'%':'0%'
        }
        if(_st)clearTimeout(_st);
        _st=setTimeout(function(){
          try{
            var d=JSON.parse(localStorage.getItem('dn_progress')||'{}');
            d['spirit-blade']={chapter:'ch-1',scroll:window.scrollY,time:Date.now()};
            localStorage.setItem('dn_progress',JSON.stringify(d))
          }catch(e){}
        },500)
      });
    })();
    </script>
