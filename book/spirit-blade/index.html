<style>/* ============================================
   DESIGN TOKENS
   ============================================ */

:root {
  /* Colors - Light Mode */
  --color-bg: #F8F9FA;
  --color-surface: #FFFFFF;
  --color-surface-glass: rgba(255,255,255,.82);
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  /* Reader Themes */
  --reader-bg: #FFFFFF;
  --reader-text: #1A1A2E;

  /* Accent Colors by Genre */
  --accent-suspense: #2C3E50;
  --accent-healing: #A3B18A;
  --accent-scifi: #3B82F6;
  --accent-romance: #E88D9E;
  --accent-fantasy: #8B5CF6;
  --accent-horror: #1F2937;
  --accent-comedy: #F59E0B;
  --accent-literary: #6B7280;

  /* Spacing */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;

  /* Typography */
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 20px;
  --font-size-3xl: 22px;
  --font-size-hero: 28px;

  /* Border Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  /* Shadows - Multi-layer */
  --shadow-card: 0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --shadow-card-hover: 0 4px 8px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04),0 8px 16px rgba(0,0,0,.04);
  --shadow-sheet: 0 -4px 16px rgba(0,0,0,.08),0 -8px 32px rgba(0,0,0,.06);
  --shadow-sticky: 0 1px 4px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --shadow-float: 0 4px 12px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);

  /* Transitions */
  --t-fast: 150ms cubic-bezier(.4,0,.2,1);
  --t-normal: 200ms cubic-bezier(.4,0,.2,1);
  --t-slow: 350ms cubic-bezier(.4,0,.2,1);

  /* Typography - System Fonts Only */
  --font-sans: system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-serif: "PingFang TC","Microsoft JhengHei",Georgia,"Noto Serif TC",serif;
}

/* Night Mode */
[data-theme="night"] {
  --color-bg: #0F0F14;
  --color-surface: #1A1A24;
  --color-surface-glass: rgba(26,26,36,.88);
  --color-text-primary: #E5E7EB;
  --color-text-secondary: #9CA3AF;
  --color-text-tertiary: #6B7280;
  --color-border: #2D2D3A;
  --color-border-light: #1F1F2E;
  --reader-bg: #0F0F14;
  --reader-text: #D1D5DB;
}

/* Sepia Mode */
[data-theme="sepia"] {
  --color-bg: #FDF6E3;
  --color-surface: #FAF0E4;
  --color-surface-glass: rgba(250,240,228,.88);
  --color-text-primary: #5C4B37;
  --color-text-secondary: #8B7355;
  --color-text-tertiary: #A89070;
  --color-border: #E8DCC8;
  --color-border-light: #F0E8D8;
  --reader-bg: #FDF6E3;
  --reader-text: #5C4B37;
}

/* ============================================
   BASE RESET
   ============================================ */

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
html { font-size:16px; scroll-behavior:smooth; overscroll-behavior-y:contain; }
body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  overflow-x: hidden;
}
a { text-decoration:none; color:inherit; }
button { border:none; background:none; cursor:pointer; font-family:inherit; }
input,select { font-family:inherit; }

/* Scrollbar */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--color-border); border-radius:var(--radius-full); }

/* ============================================
   UTILITY CLASSES
   ============================================ */

.hidden { display:none!important; }
.truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Touch Target - 44px minimum */
button, a.btn-press, [role="button"] {
  min-height: 44px;
  min-width: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Micro-interactions */
.btn-press {
  transition: transform var(--t-fast), opacity var(--t-fast);
}
.btn-press:active {
  transform: scale(0.96);
  opacity: 0.85;
}

/* Bookmark bounce animation */
@keyframes bookmark-bounce {
  0% { transform: scale(1); }
  30% { transform: scale(1.15); }
  60% { transform: scale(0.95); }
  100% { transform: scale(1); }
}
.btn-press.bookmark-active:active {
  animation: bookmark-bounce 300ms cubic-bezier(.4,0,.2,1);
}

.card-hover {
  transition: transform var(--t-normal), box-shadow var(--t-normal);
}
.card-hover:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-card-hover);
}

/* Scroll Snap */
.scroll-snap { scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
.scroll-snap > * { scroll-snap-align:start; }

/* ============================================
   HEADER - Glassmorphism
   ============================================ */

.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 30;
  background: var(--color-surface-glass);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow-sticky);
  padding-top: env(safe-area-inset-top);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--spacing-lg);
  height: 48px;
}
.logo { display:flex; align-items:center; gap:8px; }
.logo svg { width:28px; height:28px; }
.logo-text { font-size:var(--font-size-lg); font-weight:700; }

/* ============================================
   HOMEPAGE - Modern App Design
   ============================================ */

.home-page { padding-top:48px; }

/* Hero Section */
.home-hero {
  position: relative;
  margin: 0 var(--spacing-lg);
  margin-top: var(--spacing-lg);
  padding: 24px 20px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: linear-gradient(135deg, #1A1A2E 0%, #2C3E50 50%, #3B82F6 100%);
}
.hero-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 80% 20%, rgba(59,130,246,.15) 0%, transparent 60%),
              radial-gradient(circle at 20% 80%, rgba(139,92,246,.1) 0%, transparent 50%);
}
.hero-content { position:relative; z-index:1; }
.hero-badge {
  display: inline-block;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,.1);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  color: rgba(255,255,255,.9);
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 16px;
  border: 1px solid rgba(255,255,255,.08);
}
.hero-stats {
  display: flex;
  align-items: center;
  gap: 16px;
}
.hero-stat { text-align:center; flex:1; }
.hero-stat-num {
  display: block;
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.02em;
}
.hero-stat-label {
  display: block;
  font-size: 11px;
  color: rgba(255,255,255,.6);
  margin-top: 2px;
}
.hero-stat-divider {
  width: 1px;
  height: 32px;
  background: rgba(255,255,255,.15);
}

/* Section Layout */
.home-section {
  padding: 24px 0 0;
}
.home-section-last {
  padding-bottom: 80px;
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--spacing-lg);
  margin-bottom: var(--spacing-md);
}
.section-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--color-text-primary);
  letter-spacing: -0.02em;
  margin: 0;
  padding: 0;
}

/* Featured Cards - Horizontal Scroll */
.featured-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 0 var(--spacing-lg) var(--spacing-md);
  padding-right: calc(var(--spacing-lg) + 50px);
  scrollbar-width: none;
  scroll-snap-type: x mandatory;
}
.featured-scroll::-webkit-scrollbar { display:none; }
.featured-card {
  flex-shrink: 0;
  width: 160px;
  scroll-snap-align: start;
}
.css-book-cover {
  margin-bottom: 8px;
}
.featured-info { padding: 8px 2px 0; }
.featured-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--color-text-primary);
}
.featured-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}
.featured-rating {
  font-size: 12px;
  font-weight: 700;
}
.featured-status {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: var(--radius-full);
  font-weight: 500;
}
.status-done { background:rgba(163,177,138,.2); color:var(--accent-healing); }
.status-ongoing { background:rgba(59,130,246,.15); color:var(--accent-scifi); }

/* Ranking List */
.rank-list { padding: 0; }
.rank-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
}
.rank-num {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  background: var(--color-border);
  color: var(--color-text-secondary);
}
.rank-num.rank-top {
  background: linear-gradient(135deg, #FF6B35, #FF8F65);
  color: #fff;
}
.css-book-cover-mini {
  margin: 0;
}
.rank-info { flex:1; min-width:0; }
.rank-title {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rank-sub {
  font-size: 11px;
  color: var(--color-text-secondary);
  margin-top: 2px;
}
.rank-score {
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}

/* Bento Grid */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 72px;
  gap: 10px;
  padding: 0 var(--spacing-lg);
}
.bento-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: var(--radius-md);
  background: var(--color-surface);
  box-shadow: var(--shadow-card);
  transition: transform var(--t-fast), box-shadow var(--t-fast);
  position: relative;
  overflow: hidden;
}
.bento-item::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--cat-color);
  opacity: .7;
}
.bento-item:active {
  transform: scale(0.95);
  box-shadow: var(--shadow-card-hover);
}
.bento-lg {
  grid-column: span 2;
  grid-row: span 2;
}
.bento-lg .bento-icon { font-size: 32px; }
.bento-lg .bento-name { font-size: 14px; font-weight: 600; }
.bento-md {
  grid-column: span 2;
}
.bento-icon { font-size: 22px; }
.bento-name { font-size: 11px; color: var(--color-text-secondary); }

/* ============================================
   CSS DYNAMIC BOOK COVERS
   ============================================ */

.css-book-cover {
  aspect-ratio: 2/3;
  border-radius: var(--radius-md);
  background-color: hsl(var(--hue), 75%, 65%);
  background-size: cover;
  background-position: center;
  box-shadow: inset 3px 0 8px rgba(255,255,255,.25), inset -3px 0 8px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.12);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 16px;
  box-sizing: border-box;
  text-align: center;
  color: #fff;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.cover-bg-overlay {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.css-book-cover::before {
  content: '';
  position: absolute;
  top: -30%;
  right: -30%;
  width: 80%;
  height: 80%;
  background: radial-gradient(circle, rgba(255,255,255,.12) 0%, transparent 70%);
  border-radius: 50%;
  z-index: 1;
}
.css-book-cover::after {
  content: '';
  position: absolute;
  bottom: -20%;
  left: -20%;
  width: 60%;
  height: 60%;
  background: radial-gradient(circle, rgba(0,0,0,.08) 0%, transparent 70%);
  border-radius: 50%;
  z-index: 1;
}
.cover-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  width: 100%;
}
.cover-tag {
  font-size: 10px;
  background: rgba(0,0,0,.2);
  padding: 3px 8px;
  border-radius: var(--radius-full);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  margin-bottom: 8px;
  font-weight: 500;
  letter-spacing: .02em;
}
.cover-title {
  font-weight: 800;
  line-height: 1.25;
  margin: 0;
  text-shadow: 0 2px 6px rgba(0,0,0,.3);
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.cover-author {
  font-size: .7em;
  opacity: .85;
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  text-shadow: 0 1px 3px rgba(0,0,0,.2);
}

/* Mini cover variant (for ranking, category lists) */
.css-book-cover-mini {
  box-shadow: inset 2px 0 6px rgba(255,255,255,.2), 0 2px 6px rgba(0,0,0,.1);
  padding: 8px;
  margin: 0;
}
.css-book-cover-mini::before,
.css-book-cover-mini::after { display: none; }
.css-book-cover-mini .cover-content { justify-content: center; }
.css-book-cover-mini .cover-title { font-size: inherit; }

/* ============================================
   FEATURED - Peeking Cards (legacy)
   ============================================ */

.swipe-row {
  display: flex;
  gap: var(--spacing-md);
  overflow-x: auto;
  padding: 0 var(--spacing-lg) var(--spacing-md);
  padding-right: calc(var(--spacing-lg) + 60px);
  scrollbar-width: none;
}
.swipe-row::-webkit-scrollbar { display:none; }
.book-card {
  flex-shrink: 0;
  width: 130px;
  overflow: hidden;
}
.book-card h3 {
  font-size: 13px;
  font-weight: 600;
  margin-top: var(--spacing-sm);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.book-rating { font-size:var(--font-size-sm); font-weight:700; }

/* ============================================
   RANKING
   ============================================ */

.rank-tabs {
  display: flex;
  gap: var(--spacing-xl);
  padding: 0 var(--spacing-lg);
  margin-bottom: var(--spacing-md);
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--color-text-secondary);
  border-bottom: 1px solid var(--color-border);
}
.rank-tab { padding-bottom:var(--spacing-sm); position:relative; }
.rank-tab.active { color:var(--color-text-primary); }
.rank-tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  border-radius: var(--radius-full);
  background: currentColor;
}
.rank-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
}
.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: var(--font-size-base);
  flex-shrink: 0;
}
.rank-1 { background:linear-gradient(135deg,#FFD700,#FFA500); color:#fff; }
.rank-2 { background:linear-gradient(135deg,#C0C0C0,#A0A0A0); color:#fff; }
.rank-3 { background:linear-gradient(135deg,#CD7F32,#A0522D); color:#fff; }
.rank-other { background:var(--color-border-light); color:var(--color-text-tertiary); }

/* ============================================
   BENTO BOX CATEGORY GRID
   ============================================ */

.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: minmax(72px, auto);
  gap: var(--spacing-md);
  padding: 0 var(--spacing-lg);
}
.cat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--spacing-xs);
  padding: var(--spacing-md);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  box-shadow: var(--shadow-card);
  transition: transform var(--t-fast), box-shadow var(--t-fast);
}
.cat-item:active {
  transform: scale(0.96);
  box-shadow: var(--shadow-card-hover);
}
/* Featured category - spans 2 columns */
.cat-item.featured {
  grid-column: span 2;
  grid-row: span 2;
  padding: var(--spacing-xl);
}
.cat-item.featured .cat-icon { font-size: 32px; }
.cat-item.featured .cat-name { font-size: var(--font-size-base); font-weight: 600; }
.cat-icon { font-size: 24px; }
.cat-name { font-size: var(--font-size-sm); color: var(--color-text-secondary); }

/* ============================================
   AD PLACEHOLDER - CLS Safe
   ============================================ */

.ad {
  background: linear-gradient(135deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 2s infinite;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-tertiary);
  font-size: var(--font-size-sm);
  letter-spacing: .05em;
  text-transform: uppercase;
  border: 1px dashed var(--color-border);
  margin: var(--spacing-lg);
  min-height: 96px;
  aspect-ratio: 16/9;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ============================================
   SECTION TITLES - Typography Hierarchy
   ============================================ */

.section-title {
  font-size: var(--font-size-3xl);
  font-weight: 800;
  padding: 0 var(--spacing-lg);
  margin-bottom: var(--spacing-md);
  letter-spacing: -0.02em;
}

/* ============================================
   PAGE LAYOUT
   ============================================ */

.page {
  padding-top: 48px;
  min-height: 100dvh;
}

/* ============================================
   BOOK DETAIL - Blurred Header + Sticky CTA
   ============================================ */

.detail-hero {
  position: relative;
  overflow: hidden;
