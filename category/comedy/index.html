<style>/* ============================================
   DESIGN TOKENS
   ============================================ */

:root {
  /* Colors - Light Mode */
  --color-bg: #F8F9FA;
  --color-surface: #FFFFFF;
  --color-surface-glass: rgba(255,255,255,.72);
  --color-text-primary: #1A1A2E;
  --color-text-secondary: #6B7280;
  --color-text-tertiary: #9CA3AF;
  --color-border: #E5E7EB;
  --color-border-light: #F3F4F6;

  /* Reader Themes */
  --reader-bg: #FFFFFF;
  --reader-text: #1A1A2E;

  /* Accent Colors by Genre */
  --accent-suspense: #2C3E50;
  --accent-healing: #A3B18A;
  --accent-scifi: #3B82F6;
  --accent-romance: #E88D9E;
  --accent-fantasy: #8B5CF6;
  --accent-horror: #1F2937;
  --accent-comedy: #F59E0B;
  --accent-literary: #6B7280;

  /* RGB values for shadow tints */
  --accent-rgb: 139,92,246;

  /* Spacing */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;

  /* Typography */
  --font-size-xs: 11px;
  --font-size-sm: 12px;
  --font-size-base: 14px;
  --font-size-lg: 16px;
  --font-size-xl: 18px;
  --font-size-2xl: 20px;
  --font-size-3xl: 22px;
  --font-size-hero: 28px;

  /* Border Radius */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-2xl: 32px;
  --radius-full: 9999px;

  /* Shadows - Multi-layer */
  --shadow-card: 0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --shadow-card-hover: 0 4px 8px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04),0 8px 16px rgba(0,0,0,.04);
  --shadow-sheet: 0 -4px 16px rgba(0,0,0,.08),0 -8px 32px rgba(0,0,0,.06);
  --shadow-sticky: 0 1px 4px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --shadow-float: 0 4px 12px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06);
  --shadow-deep: 0 2px 4px rgba(0,0,0,.04),0 8px 16px rgba(0,0,0,.06),0 16px 32px rgba(0,0,0,.04);
  --shadow-hover: 0 4px 8px rgba(0,0,0,.06),0 12px 24px rgba(0,0,0,.08),0 20px 40px rgba(var(--accent-rgb),.1);

  /* Glass */
  --glass-bg: rgba(255,255,255,.72);
  --glass-border: rgba(255,255,255,.18);

  /* Transitions */
  --t-fast: 150ms cubic-bezier(.4,0,.2,1);
  --t-normal: 200ms cubic-bezier(.4,0,.2,1);
  --t-slow: 350ms cubic-bezier(.4,0,.2,1);
  --t-bounce: 400ms cubic-bezier(.34,1.56,.64,1);

  /* Typography - System Fonts Only */
  --font-sans: system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-serif: "PingFang TC","Microsoft JhengHei",Georgia,"Noto Serif TC",serif;
}

/* Night Mode */
[data-theme="night"] {
  --color-bg: #0F0F14;
  --color-surface: #1A1A24;
  --color-surface-glass: rgba(26,26,36,.88);
  --color-text-primary: #E5E7EB;
  --color-text-secondary: #9CA3AF;
  --color-text-tertiary: #6B7280;
  --color-border: #2D2D3A;
  --color-border-light: #1F1F2E;
  --reader-bg: #0F0F14;
  --reader-text: #D1D5DB;
}

/* Sepia Mode */
[data-theme="sepia"] {
  --color-bg: #FDF6E3;
  --color-surface: #FAF0E4;
  --color-surface-glass: rgba(250,240,228,.88);
  --color-text-primary: #5C4B37;
  --color-text-secondary: #8B7355;
  --color-text-tertiary: #A89070;
  --color-border: #E8DCC8;
  --color-border-light: #F0E8D8;
  --reader-bg: #FDF6E3;
  --reader-text: #5C4B37;
}

/* ============================================
   BASE RESET
   ============================================ */

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
html { font-size:16px; scroll-behavior:smooth; overscroll-behavior-y:contain; }
body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  overflow-x: hidden;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  opacity: .025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px 256px;
  mix-blend-mode: overlay;
  pointer-events: none;
}
a { text-decoration:none; color:inherit; }
button { border:none; background:none; cursor:pointer; font-family:inherit; }
input,select { font-family:inherit; }

/* Scrollbar */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--color-border); border-radius:var(--radius-full); }

/* ============================================
   UTILITY CLASSES
   ============================================ */

.hidden { display:none!important; }
.truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Touch Target - 44px minimum */
button, a.btn-press, [role="button"] {
  min-height: 44px;
  min-width: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* Micro-interactions */
.btn-press {
  transition: transform var(--t-fast), opacity var(--t-fast);
}
.btn-press:active {
  transform: scale(0.96);
  opacity: 0.85;
}

/* Bookmark bounce animation */
@keyframes bookmark-bounce {
  0% { transform: scale(1); }
  30% { transform: scale(1.15); }
  60% { transform: scale(0.95); }
  100% { transform: scale(1); }
}
.btn-press.bookmark-active:active {
  animation: bookmark-bounce 300ms cubic-bezier(.4,0,.2,1);
}

.card-hover {
  transition: transform var(--t-normal), box-shadow var(--t-normal);
}
.card-hover:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-card-hover);
}

/* Scroll Snap */
.scroll-snap { scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
.scroll-snap > * { scroll-snap-align:start; }

/* ============================================
   HEADER - Glassmorphism
   ============================================ */

.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 30;
  background: var(--color-surface-glass);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: var(--shadow-sticky);
  padding-top: env(safe-area-inset-top);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--spacing-lg);
  height: 48px;
}
.logo { display:flex; align-items:center; gap:8px; }
.logo svg { width:28px; height:28px; }
.logo-text { font-size:var(--font-size-lg); font-weight:700; }

/* ============================================
   HOMEPAGE - Modern App Design
   ============================================ */

.home-page { padding-top:48px; }

/* Hero Section */
.home-hero {
  position: relative;
  margin: 0 var(--spacing-lg);
  margin-top: var(--spacing-lg);
  padding: 24px 20px;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: linear-gradient(135deg, #1A1A2E 0%, #2C3E50 50%, #3B82F6 100%);
}
.hero-bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 80% 20%, rgba(59,130,246,.15) 0%, transparent 60%),
              radial-gradient(circle at 20% 80%, rgba(139,92,246,.1) 0%, transparent 50%);
  animation: hero-drift 8s ease-in-out infinite alternate;
}
@keyframes hero-drift {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.05) translate(-2%, 1%); }
}
@media (prefers-reduced-motion: reduce) {
  .hero-bg { animation: none; }
}
.hero-content { position:relative; z-index:1; }
.hero-badge {
  display: inline-block;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: rgba(255,255,255,.1);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  color: rgba(255,255,255,.9);
  font-size: 12px;
  font-weight: 500;
  margin-bottom: 16px;
  border: 1px solid rgba(255,255,255,.08);
}
.hero-stats {
  display: flex;
  align-items: center;
  gap: 16px;
}
.hero-stat { text-align:center; flex:1; }
.hero-stat-num {
  display: block;
  font-size: 24px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.02em;
}
.hero-stat-label {
  display: block;
  font-size: 11px;
  color: rgba(255,255,255,.6);
  margin-top: 2px;
}
.hero-stat-divider {
  width: 1px;
  height: 32px;
  background: rgba(255,255,255,.15);
}

/* Section Layout */
.home-section {
  padding: 24px 0 0;
}
.home-section-last {
  padding-bottom: 80px;
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--spacing-lg);
  margin-bottom: var(--spacing-md);
}
.section-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--color-text-primary);
  letter-spacing: -0.02em;
  margin: 0;
  padding: 0;
}

/* Section Divider */
.section-divider {
  height: 1px;
  margin: 0 var(--spacing-lg);
  background: linear-gradient(90deg, transparent, var(--color-border), transparent);
}

/* Glass Card */
.glass-card {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
}
@supports not (backdrop-filter: blur(16px)) {
  .glass-card { background: var(--color-surface); }
}

/* Featured Cards - Horizontal Scroll */
.featured-scroll {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 0 var(--spacing-lg) var(--spacing-md);
  padding-right: calc(var(--spacing-lg) + 60px);
  scrollbar-width: none;
  scroll-snap-type: x mandatory;
}
.featured-scroll::-webkit-scrollbar { display:none; }
.featured-card {
  flex-shrink: 0;
  width: 160px;
  scroll-snap-align: start;
  background: var(--color-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-light);
  box-shadow: var(--shadow-card);
  transition: transform var(--t-normal), box-shadow var(--t-normal);
  overflow: hidden;
}
.featured-card:active {
  transform: scale(0.97);
  box-shadow: var(--shadow-card);
}
@media (hover: hover) {
  .featured-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
  }
}
.css-book-cover {
  margin-bottom: 0;
  border-radius: 0;
  box-shadow: none;
}
.featured-info { padding: 10px 10px 12px; }
.featured-title {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: var(--color-text-primary);
}
.featured-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.featured-rating {
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.featured-status {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  font-weight: 500;
  letter-spacing: .02em;
}
.status-done { background:rgba(163,177,138,.2); color:var(--accent-healing); }
.status-ongoing { background:rgba(59,130,246,.15); color:var(--accent-scifi); }

/* Ranking List */
.rank-list { padding: 0; }
.rank-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
  transition: background var(--t-fast);
}
.rank-item:active { background: var(--color-border-light); }
@media (hover: hover) {
  .rank-item:hover { background: var(--color-border-light); }
}
.rank-num {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  background: var(--color-border);
  color: var(--color-text-secondary);
  font-variant-numeric: tabular-nums;
}
.rank-num.rank-top {
  background: linear-gradient(135deg, #FF6B35, #FF8F65);
  color: #fff;
}
.css-book-cover-mini {
  margin: 0;
}
.rank-info { flex:1; min-width:0; }
.rank-title {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rank-sub {
  font-size: 11px;
  color: var(--color-text-secondary);
  margin-top: 2px;
}
.rank-score {
  font-size: 14px;
  font-weight: 700;
  flex-shrink: 0;
}

/* Bento Grid */
.bento-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 72px;
  gap: 10px;
  padding: 0 var(--spacing-lg);
}
.bento-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: var(--radius-md);
  background: var(--color-surface);
  box-shadow: var(--shadow-card);
  transition: transform var(--t-fast), box-shadow var(--t-fast);
  position: relative;
  overflow: hidden;
}
.bento-item::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--cat-color);
  opacity: .7;
}
.bento-item:active {
  transform: scale(0.95);
  box-shadow: var(--shadow-card-hover);
}
@media (hover: hover) {
  .bento-item:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
  }
  .bento-item:hover .bento-icon {
    transform: scale(1.15);
  }
}
.bento-icon {
  font-size: 22px;
  transition: transform var(--t-bounce);
  transform-origin: center;
}
.bento-lg {
  grid-column: span 2;
  grid-row: span 2;
}
.bento-lg .bento-icon { font-size: 32px; }
.bento-lg .bento-name { font-size: 14px; font-weight: 600; }
.bento-md {
  grid-column: span 2;
}
.bento-name { font-size: 11px; color: var(--color-text-secondary); }

/* Mobile Bento Responsive */
@media (max-width: 480px) {
  .bento-grid {
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 64px;
  }
  .bento-lg {
    grid-column: span 2;
    grid-row: span 1;
  }
  .bento-md {
    grid-column: span 1;
  }
}

/* Scroll Reveal Animation */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity var(--t-slow), transform var(--t-slow);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
@media (prefers-reduced-motion: reduce) {
  .reveal {
    opacity: 1;
    transform: none;
    transition: none;
  }
}

/* ============================================
   CSS DYNAMIC BOOK COVERS
   ============================================ */

.css-book-cover {
  aspect-ratio: 2/3;
  border-radius: var(--radius-md);
  box-shadow: inset 3px 0 8px rgba(255,255,255,.25), inset -3px 0 8px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.12);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 16px;
  box-sizing: border-box;
  text-align: center;
  color: #fff;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.cover-decorations {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.css-book-cover::before {
  content: '';
  position: absolute;
  top: -30%;
  right: -30%;
  width: 80%;
  height: 80%;
  background: radial-gradient(circle, rgba(255,255,255,.12) 0%, transparent 70%);
  border-radius: 50%;
  z-index: 1;
}
.css-book-cover::after {
  content: '';
  position: absolute;
  bottom: -20%;
  left: -20%;
  width: 60%;
  height: 60%;
  background: radial-gradient(circle, rgba(0,0,0,.08) 0%, transparent 70%);
  border-radius: 50%;
  z-index: 1;
}
.cover-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  width: 100%;
}
.cover-tag {
  font-size: 10px;
  background: rgba(0,0,0,.2);
  padding: 3px 8px;
  border-radius: var(--radius-full);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  margin-bottom: 8px;
  font-weight: 500;
  letter-spacing: .02em;
}
.cover-title {
  font-weight: 800;
  line-height: 1.25;
  margin: 0;
  text-shadow: 0 2px 6px rgba(0,0,0,.3);
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.cover-author {
  font-size: .7em;
  opacity: .85;
  position: absolute;
  bottom: 12px;
  left: 0;
  right: 0;
  text-shadow: 0 1px 3px rgba(0,0,0,.2);
}

/* Mini cover variant (for ranking, category lists) */
.css-book-cover-mini {
  box-shadow: inset 2px 0 6px rgba(255,255,255,.2), 0 2px 6px rgba(0,0,0,.1);
  padding: 8px;
  margin: 0;
}
.css-book-cover-mini::before,
.css-book-cover-mini::after { display: none; }
.css-book-cover-mini .cover-content { justify-content: center; }
.css-book-cover-mini .cover-title { font-size: inherit; }

/* ============================================
   FEATURED - Peeking Cards (legacy)
   ============================================ */

.swipe-row {
  display: flex;
  gap: var(--spacing-md);
  overflow-x: auto;
  padding: 0 var(--spacing-lg) var(--spacing-md);
  padding-right: calc(var(--spacing-lg) + 60px);
  scrollbar-width: none;
}
.swipe-row::-webkit-scrollbar { display:none; }
.book-card {
  flex-shrink: 0;
  width: 130px;
  overflow: hidden;
}
.book-card h3 {
  font-size: 13px;
  font-weight: 600;
  margin-top: var(--spacing-sm);
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.book-rating { font-size:var(--font-size-sm); font-weight:700; }

/* ============================================
   RANKING
   ============================================ */

.rank-tabs {
  display: flex;
  gap: var(--spacing-xl);
  padding: 0 var(--spacing-lg);
  margin-bottom: var(--spacing-md);
  font-size: var(--font-size-base);
  font-weight: 500;
  color: var(--color-text-secondary);
  border-bottom: 1px solid var(--color-border);
}
.rank-tab { padding-bottom:var(--spacing-sm); position:relative; }
.rank-tab.active { color:var(--color-text-primary); }
.rank-tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  border-radius: var(--radius-full);
  background: currentColor;
}
.rank-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-md);
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--color-border-light);
}
.rank-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: var(--font-size-base);
  flex-shrink: 0;
}
