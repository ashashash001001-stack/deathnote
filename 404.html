<style>/* ═══════════════════════════════════════════════════════════
   DEATHNOTE 2026 - NEO-BRUTALISM DESIGN SYSTEM
   Version: 3.0 - Bold, Raw, Unapologetic
   ═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   1. COLOR PALETTE - Neo-Brutalism
   ═══════════════════════════════════════════════════════════ */

:root {
  --color-primary: #FF6B00;
  --color-primary-light: #FF8533;
  --color-primary-dark: #CC5500;
  
  --color-bg: #FFFDF7;
  --color-surface: #FFFFFF;
  --color-surface-glass: #FFFFFF;
  
  --color-text-primary: #1A1A1A;
  --color-text-secondary: #4A4A4A;
  --color-text-tertiary: #888888;
  
  --accent-suspense: #1A1A1A;
  --accent-healing: #34D399;
  --accent-scifi: #3B82F6;
  --accent-romance: #EC4899;
  --accent-fantasy: #8B5CF6;
  --accent-horror: #DC2626;
  --accent-comedy: #FBBF24;
  --accent-literary: #6B7280;
  
  --color-success: #34D399;
  --color-warning: #FBBF24;
  --color-error: #EF4444;
  --color-info: #3B82F6;
  
  --color-border-light: #E5E5E5;
  --color-border: #1A1A1A;
  --color-border-strong: #1A1A1A;
  
  /* ═══════════════════════════════════════════════════════════
     2. SHADOW SYSTEM - Hard Offset Shadows (Neo-Brutalism)
     ═══════════════════════════════════════════════════════════ */
  
  --shadow-xs: 3px 3px 0 #1A1A1A;
  --shadow-sm: 4px 4px 0 #1A1A1A;
  --shadow-md: 5px 5px 0 #1A1A1A;
  --shadow-lg: 6px 6px 0 #1A1A1A;
  --shadow-xl: 8px 8px 0 #1A1A1A;
  --shadow-glow: none;
  
  --shadow-card: var(--shadow-sm);
  --shadow-card-hover: var(--shadow-md);
  --shadow-sheet: var(--shadow-lg);
  --shadow-sticky: var(--shadow-sm);
  --shadow-float: var(--shadow-md);
  --shadow-deep: var(--shadow-xl);
  --shadow-hover: var(--shadow-lg);
  
  /* ═══════════════════════════════════════════════════════════
     3. SPACING - 4px Grid System
     ═══════════════════════════════════════════════════════════ */
  
  --spacing-1: 4px;
  --spacing-2: 8px;
  --spacing-3: 12px;
  --spacing-4: 16px;
  --spacing-5: 20px;
  --spacing-6: 24px;
  --spacing-8: 32px;
  --spacing-10: 40px;
  --spacing-12: 48px;
  
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 24px;
  --spacing-2xl: 32px;
  
  /* ═══════════════════════════════════════════════════════════
     4. TYPOGRAPHY - Bold, Raw
     ═══════════════════════════════════════════════════════════ */
  
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-hero: 2.25rem;
  
  --font-normal: 500;
  --font-medium: 600;
  --font-semibold: 700;
  --font-bold: 800;
  --font-extrabold: 900;
  
  /* ═══════════════════════════════════════════════════════════
     5. BORDER RADIUS - Minimal, Sharp
     ═══════════════════════════════════════════════════════════ */
  
  --radius-sm: 0px;
  --radius-md: 2px;
  --radius-lg: 4px;
  --radius-xl: 6px;
  --radius-2xl: 8px;
  --radius-full: 9999px;
  
  --radius-xs: 0px;
  
  /* ═══════════════════════════════════════════════════════════
     6. MOTION - Snappy, Direct
     ═══════════════════════════════════════════════════════════ */
  
  --motion-instant: 0ms;
  --motion-fast: 100ms;
  --motion-normal: 150ms;
  --motion-slow: 200ms;
  --motion-smooth: 200ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  
  --t-fast: 100ms;
  --t-normal: 150ms;
  --t-slow: 200ms;
  --t-bounce: 150ms cubic-bezier(0.34, 1.56, 0.64, 1);
  
  --glass-bg: #FFFFFF;
  --glass-border: #1A1A1A;
  --glass-blur: none;
  --glass-shadow: var(--shadow-sm);
  
  --reader-bg: #FFFFFF;
  --reader-text: #1A1A1A;
}

[data-theme="night"] {
  --color-bg: #0A0A0A;
  --color-surface: #1A1A1A;
  --color-surface-glass: #1A1A1A;
  --color-text-primary: #F5F5F5;
  --color-text-secondary: #A3A3A3;
  --color-text-tertiary: #737373;
  --color-border-light: #262626;
  --color-border: #F5F5F5;
  --color-border-strong: #F5F5F5;
  --shadow-xs: 3px 3px 0 #F5F5F5;
  --shadow-sm: 4px 4px 0 #F5F5F5;
  --shadow-md: 5px 5px 0 #F5F5F5;
  --shadow-lg: 6px 6px 0 #F5F5F5;
  --shadow-xl: 8px 8px 0 #F5F5F5;
  --reader-bg: #0A0A0A;
  --reader-text: #F5F5F5;
}

[data-theme="sepia"] {
  --color-bg: #F5F0E8;
  --color-surface: #FFFDF7;
  --color-surface-glass: #FFFDF7;
  --color-text-primary: #3D3225;
  --color-text-secondary: #6B5B4A;
  --color-text-tertiary: #9B8B7A;
  --color-border: #3D3225;
  --color-border-light: #E8E0D0;
  --reader-bg: #F5F0E8;
  --reader-text: #3D3225;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
html {
  font-size: 16px;
  scroll-behavior: smooth;
  overscroll-behavior-y: contain;
}
body {
  font-family: 'Space Grotesk', system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--color-bg);
  color: var(--color-text-primary);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
}

/* Micro-interactions */
.btn-press {
  transition: transform var(--t-fast), box-shadow var(--t-fast);
}
.btn-press:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}

@keyframes bookmark-bounce {
  0% { transform: scale(1); }
  30% { transform: scale(1.15); }
  60% { transform: scale(0.95); }
  100% { transform: scale(1); }
}
.btn-press.bookmark-active:active {
  animation: bookmark-bounce 300ms cubic-bezier(.4,0,.2,1);
}

.card-hover {
  transition: transform var(--t-normal), box-shadow var(--t-normal);
}
.card-hover:hover {
  transform: translate(-2px, -2px);
  box-shadow: var(--shadow-card-hover);
}

.scroll-snap { scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
.scroll-snap > * { scroll-snap-align:start; }

/* ═══════════════════════════════════════════════════════════
   HEADER - Bold, Flat
   ═══════════════════════════════════════════════════════════ */

.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 30;
  background: var(--color-surface);
  border-bottom: 3px solid var(--color-border);
  padding-top: env(safe-area-inset-top);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--spacing-4);
  height: 56px;
}
.logo { display:flex; align-items:center; gap:var(--spacing-2); }
.logo svg { width:32px; height:32px; }
.logo-text {
  font-size: var(--text-xl);
  font-weight: var(--font-extrabold);
  letter-spacing: -0.02em;
  color: var(--color-primary);
}

/* FOOTER NAV - Bold */
.footer-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 20;
  background: var(--color-surface);
  border-top: 3px solid var(--color-border);
  display: flex;
  justify-content: space-around;
  padding: var(--spacing-2) 0;
  padding-bottom: calc(var(--spacing-2) + env(safe-area-inset-bottom));
}
.footer-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: var(--text-xs);
  font-weight: var(--font-medium);
  color: var(--color-text-tertiary);
  padding: var(--spacing-2) var(--spacing-3);
  min-height: 44px;
  justify-content: center;
  border-radius: var(--radius-md);
  transition: all var(--motion-fast);
}
.footer-nav-item.active { 
  color: var(--color-primary);
}
.footer-nav-item svg { width: 20px; height: 20px; }
.footer-nav-item:hover { color: var(--color-primary); }
.footer-nav-item:active { transform: scale(0.92); }

/* ═══════════════════════════════════════════════════════════
   HOME HERO - Bold, Flat, Raw
   ═══════════════════════════════════════════════════════════ */

.home-hero {
  position: relative;
  margin: 56px 0 0;
  padding: var(--spacing-10) var(--spacing-6);
  background: var(--color-primary);
  border-bottom: 3px solid var(--color-border);
  overflow: hidden;
  min-height: 280px;
  display: flex;
  align-items: center;
}
.home-hero::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 60%;
  height: 200%;
  background: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 20px,
    rgba(0,0,0,0.03) 20px,
    rgba(0,0,0,0.03) 40px
  );
  pointer-events: none;
}

.hero-bg { display: none; }
.hero-mesh { display: none; }
.hero-glow-orb { display: none; }
.hero-decor { display: none; }
.hero-particles { display: none; }
.hero-particle { display: none; }

.hero-content { 
  position: relative; 
  z-index: 1; 
  animation: hero-enter 0.5s ease-out;
}

@keyframes hero-enter {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-badge {
  display: inline-block;
  padding: var(--spacing-2) var(--spacing-4);
  background: var(--color-surface);
  color: var(--color-primary);
  font-size: var(--text-sm);
  font-weight: var(--font-bold);
  margin-bottom: var(--spacing-4);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.hero-search-btn {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-4) var(--spacing-5);
  background: var(--color-surface);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-lg);
  color: var(--color-text-secondary);
  font-size: var(--text-base);
  font-weight: var(--font-medium);
  margin-bottom: var(--spacing-6);
  max-width: 400px;
  transition: all var(--motion-fast);
  box-shadow: var(--shadow-sm);
  text-decoration: none;
}
.hero-search-btn:hover {
  box-shadow: var(--shadow-md);
  transform: translate(-2px, -2px);
  color: var(--color-text-primary);
}
.hero-search-btn:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}

.hero-stats {
  display: flex;
  gap: var(--spacing-6);
}
.hero-stat {
  text-align: center;
  flex: 1;
  padding: var(--spacing-4);
  background: var(--color-surface);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: all var(--motion-fast);
}
.hero-stat:hover {
  transform: translate(-2px, -2px);
  box-shadow: var(--shadow-md);
}
.hero-stat-num {
  display: block;
  font-size: var(--text-2xl);
  font-weight: var(--font-extrabold);
  color: var(--color-text-primary);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.hero-stat-label {
  font-size: var(--text-xs);
  color: var(--color-text-tertiary);
  font-weight: var(--font-medium);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.hero-stat-divider {
  width: 2px;
  background: var(--color-border);
  opacity: 0.2;
  align-self: stretch;
}

@media (prefers-reduced-motion: reduce) {
  .home-hero, .hero-content, .hero-stat {
    animation: none;
    transition: none;
  }
  .hero-stat:hover {
    transform: none;
  }
}

@media (max-width: 768px) {
  .hero-stats { gap: var(--spacing-4); }
  .hero-stat { padding: var(--spacing-3); }
  .hero-stat-num { font-size: var(--text-xl); }
}

/* ═══════════════════════════════════════════════════════════
   SECTION LAYOUT
   ═══════════════════════════════════════════════════════════ */

.home-section {
  padding: 24px 0 0;
  animation: section-enter 0.4s ease-out both;
}
.home-section:nth-child(2) { animation-delay: 0.05s; }
.home-section:nth-child(3) { animation-delay: 0.1s; }
.home-section:nth-child(4) { animation-delay: 0.15s; }
.home-section:nth-child(5) { animation-delay: 0.2s; }

@keyframes section-enter {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.home-section-last {
  padding-bottom: 80px;
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--spacing-lg);
  margin-bottom: var(--spacing-md);
}
.section-title {
  font-size: 20px;
  font-weight: var(--font-extrabold);
  color: var(--color-text-primary);
  letter-spacing: -0.02em;
  margin: 0;
  padding: 0;
}

/* Section Divider */
.section-divider {
  height: 3px;
  margin: 0 var(--spacing-lg);
  background: var(--color-border);
  opacity: 0.1;
}

/* ═══════════════════════════════════════════════════════════
   FEATURED CARDS - Neo-Brutalism
   ═══════════════════════════════════════════════════════════ */

.featured-scroll {
  display: flex;
  gap: var(--spacing-4);
  overflow-x: auto;
  padding: 0 var(--spacing-4) var(--spacing-4);
  padding-right: calc(var(--spacing-4) + 60px);
  scrollbar-width: none;
  scroll-snap-type: x mandatory;
}
.featured-scroll::-webkit-scrollbar { display:none; }

.featured-card {
  flex-shrink: 0;
  width: 150px;
  scroll-snap-align: start;
  background: var(--color-surface);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: all var(--motion-fast);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: card-enter 0.4s ease-out both;
}
.featured-card:nth-child(1) { animation-delay: 0.05s; }
.featured-card:nth-child(2) { animation-delay: 0.1s; }
.featured-card:nth-child(3) { animation-delay: 0.15s; }
.featured-card:nth-child(4) { animation-delay: 0.2s; }
.featured-card:nth-child(5) { animation-delay: 0.25s; }
.featured-card:nth-child(6) { animation-delay: 0.3s; }

@keyframes card-enter {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.featured-card:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}

@media (hover: hover) {
  .featured-card:hover {
    transform: translate(-3px, -3px);
    box-shadow: var(--shadow-lg);
  }
  .featured-card:hover .css-book-cover {
    transform: scale(1.02);
  }
}

.book-cover-wrapper {
  position: relative;
  display: block;
  width: 150px;
}

.book-cover-wrapper .css-book-cover {
  display: block;
  border-radius: 0;
  transition: transform var(--motion-fast);
}

.book-cover-wrapper .css-book-cover::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 8px;
  background: rgba(0,0,0,0.2);
  z-index: 1;
  pointer-events: none;
}

.status-badge {
  position: absolute;
  top: var(--spacing-2);
  right: -2px;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: var(--font-bold);
  color: #fff;
  border-radius: 0;
  border: 2px solid var(--color-border);
  z-index: 2;
}

.status-badge.status-ongoing {
  background: var(--color-primary);
}
.status-badge.status-done {
  background: var(--color-success);
}

.featured-info {
  padding: var(--spacing-3);
}
.featured-title {
  font-size: var(--text-sm);
  font-weight: var(--font-bold);
  color: var(--color-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}
.featured-meta {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
}
.featured-rating {
  font-weight: var(--font-bold);
}

/* ═══════════════════════════════════════════════════════════
   RANKING LIST - Neo-Brutalism
   ═══════════════════════════════════════════════════════════ */

.rank-tabs {
  display: flex;
  gap: var(--spacing-2);
  padding: 0 var(--spacing-lg);
  margin-bottom: var(--spacing-md);
}
.rank-tab {
  padding: var(--spacing-2) var(--spacing-4);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-full);
  background: var(--color-surface);
  font-size: var(--text-sm);
  font-weight: var(--font-bold);
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: all var(--motion-fast);
}
.rank-tab.active {
  background: var(--color-primary);
  color: #fff;
  border-color: var(--color-border);
  box-shadow: var(--shadow-xs);
}
.rank-tab:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}

.rank-list { padding: 0; }
.rank-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px var(--spacing-lg);
  border-bottom: 2px solid var(--color-border-light);
  transition: all var(--motion-fast);
  animation: rank-enter 0.3s ease-out both;
}
.rank-item:nth-child(1) { animation-delay: 0.02s; }
.rank-item:nth-child(2) { animation-delay: 0.04s; }
.rank-item:nth-child(3) { animation-delay: 0.06s; }
.rank-item:nth-child(4) { animation-delay: 0.08s; }
.rank-item:nth-child(5) { animation-delay: 0.1s; }
.rank-item:nth-child(6) { animation-delay: 0.12s; }
.rank-item:nth-child(7) { animation-delay: 0.14s; }
.rank-item:nth-child(8) { animation-delay: 0.16s; }
.rank-item:nth-child(9) { animation-delay: 0.18s; }
.rank-item:nth-child(10) { animation-delay: 0.2s; }

@keyframes rank-enter {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}
.rank-item:active {
  background: var(--color-border-light);
  transform: translate(2px, 2px);
}
@media (hover: hover) {
  .rank-item:hover {
    background: var(--color-border-light);
    transform: translateX(4px);
  }
}
.rank-num {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: var(--font-extrabold);
  flex-shrink: 0;
  background: var(--color-surface);
  border: 2px solid var(--color-border);
  color: var(--color-text-secondary);
  font-variant-numeric: tabular-nums;
}
.rank-num.rank-top {
  background: var(--color-primary);
  color: #fff;
  border-color: var(--color-border);
  box-shadow: var(--shadow-xs);
}
.css-book-cover-mini {
  margin: 0;
}
.rank-info { flex:1; min-width:0; }
.rank-title {
  font-size: 14px;
  font-weight: var(--font-medium);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rank-sub {
  font-size: 11px;
  color: var(--color-text-secondary);
  margin-top: 2px;
}
.rank-score {
  font-size: 14px;
  font-weight: var(--font-extrabold);
  font-variant-numeric: tabular-nums;
}

@media (prefers-reduced-motion: reduce) {
  .rank-item {
    animation: none;
    transition: none;
    transform: none !important;
  }
}

/* ═══════════════════════════════════════════════════════════
   CATEGORY GRID - Neo-Brutalism
   ═══════════════════════════════════════════════════════════ */

.cat-section {
  padding: 24px 0;
}
.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--spacing-3);
  padding: 0 var(--spacing-lg);
}
.cat-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--spacing-1);
  padding: var(--spacing-4);
  background: var(--color-surface);
  border: 3px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs);
  transition: all var(--motion-fast);
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.cat-item:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}
@media (hover: hover) {
  .cat-item:hover {
    transform: translate(-2px, -2px);
    box-shadow: var(--shadow-md);
  }
}
.cat-item.featured {
  grid-column: span 2;
  grid-row: span 2;
  padding: var(--spacing-6);
}
.cat-icon { font-size: 24px; }
.cat-item.featured .cat-icon { font-size: 40px; }
.cat-name {
  font-size: var(--text-xs);
  font-weight: var(--font-bold);
  color: var(--color-text-secondary);
  text-align: center;
}
.cat-item.featured .cat-name {
  font-size: var(--text-base);
}

@media (max-width: 768px) {
  .cat-grid { grid-template-columns: repeat(4, 1fr); gap: var(--spacing-2); }
  .cat-item { padding: var(--spacing-3); }
  .cat-icon { font-size: 20px; }
  .cat-item.featured { grid-column: span 2; grid-row: span 1; padding: var(--spacing-4); }
}

@media (max-width: 360px) {
  .cat-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .cat-item.featured {
    grid-column: span 2;
    grid-row: span 1;
  }
}

/* ═══════════════════════════════════════════════════════════
   LATEST UPDATES
   ═══════════════════════════════════════════════════════════ */

.latest-list {
  display: flex;
  flex-direction: column;
  padding: 0;
}
.latest-item {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-3) var(--spacing-lg);
  border-bottom: 2px solid var(--color-border-light);
  transition: all var(--motion-fast);
}
.latest-item:active {
  background: var(--color-border-light);
  transform: translate(2px, 2px);
}
@media (hover: hover) {
  .latest-item:hover {
    background: var(--color-border-light);
  }
}
.latest-info { flex: 1; min-width: 0; }
.latest-title {
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  color: var(--color-text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.latest-chapter {
  font-size: var(--text-xs);
  color: var(--color-text-tertiary);
  margin-top: 2px;
}
.latest-time {
  font-size: var(--text-xs);
  color: var(--color-text-tertiary);
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════════════════════
   CSS BOOK COVERS - Neo-Brutalism
   ═══════════════════════════════════════════════════════════ */

.css-book-cover {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid var(--color-border);
  border-radius: 0;
  overflow: hidden;
  font-family: 'Space Grotesk', system-ui, sans-serif;
}
.css-book-cover::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 50%);
  pointer-events: none;
}
.cover-decorations {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.cover-content {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: var(--spacing-4);
  color: #fff;
}
.cover-title {
  font-size: 18px;
  font-weight: var(--font-extrabold);
  color: #fff;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  line-height: 1.3;
  letter-spacing: -0.01em;
}
.cover-author {
  font-size: 12px;
  color: rgba(255,255,255,0.8);
  margin-top: 4px;
  font-weight: var(--font-medium);
}
.cover-tag {
  display: inline-block;
  padding: 2px 8px;
  background: rgba(0,0,0,0.3);
  color: #fff;
  font-size: 10px;
  font-weight: var(--font-bold);
  border-radius: 0;
  margin-bottom: var(--spacing-2);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.cover-synopsis {
  font-size: 11px;
  color: rgba(255,255,255,0.7);
  line-height: 1.4;
  margin-top: var(--spacing-2);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.css-book-cover-mini {
  border: 2px solid var(--color-border);
}
.css-book-cover-mini .cover-title {
  font-size: 14px;
}

/* ═══════════════════════════════════════════════════════════
   BOOK DETAIL PAGE
   ═══════════════════════════════════════════════════════════ */

.book-detail {
  padding-top: 56px;
}
.detail-hero {
  position: relative;
  display: flex;
  gap: var(--spacing-lg);
  padding: var(--spacing-lg);
  background: var(--color-surface);
  border-bottom: 3px solid var(--color-border);
}
.detail-cover {
  flex-shrink: 0;
}
.detail-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: var(--spacing-2);
}
.detail-title {
  font-size: var(--text-2xl);
  font-weight: var(--font-extrabold);
  color: var(--color-text-primary);
  letter-spacing: -0.02em;
}
.detail-author {
  font-size: var(--text-base);
  color: var(--color-text-secondary);
  font-weight: var(--font-medium);
}
.detail-meta {
  display: flex;
  gap: var(--spacing-lg);
  font-size: var(--font-size-sm);
  color: var(--color-text-tertiary);
}

/* Sticky Bottom CTA */
.sticky-cta {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 25;
  background: var(--color-surface);
  border-top: 3px solid var(--color-border);
  padding: var(--spacing-md) var(--spacing-lg);
  padding-bottom: calc(var(--spacing-md) + env(safe-area-inset-bottom));
  display: flex;
  gap: var(--spacing-md);
}
.btn-primary {
  flex: 1;
  padding: var(--spacing-md);
  border-radius: var(--radius-md);
  color: #fff;
  text-align: center;
  font-weight: var(--font-bold);
  font-size: var(--font-size-base);
  min-height: 48px;
  background: var(--color-primary);
  border: 3px solid var(--color-border);
  box-shadow: var(--shadow-xs);
  transition: all var(--motion-fast);
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-primary:hover {
  box-shadow: var(--shadow-md);
  transform: translate(-2px, -2px);
}
.btn-primary:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}
.btn-secondary {
  padding: var(--spacing-md) var(--spacing-xl);
  border-radius: var(--radius-md);
  border: 3px solid var(--color-border);
  color: var(--color-text-primary);
  background: var(--color-surface);
  font-weight: var(--font-bold);
  min-height: 48px;
  box-shadow: var(--shadow-xs);
  transition: all var(--motion-fast);
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.btn-secondary:hover {
  box-shadow: var(--shadow-md);
  transform: translate(-2px, -2px);
}
.btn-secondary:active {
  transform: translate(2px, 2px);
  box-shadow: none;
}

/* Synopsis */
.synopsis { padding:0 var(--spacing-lg); margin-bottom:var(--spacing-xl); }
.synopsis-text {
  font-size: var(--font-size-base);
  color: var(--color-text-secondary);
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.synopsis-text.expanded { -webkit-line-clamp:unset; overflow:visible; }
.synopsis-toggle { font-size:var(--font-size-base); margin-top:var(--spacing-xs); }

/* TOC */
.toc { padding:0 var(--spacing-lg) 100px; position:relative; }
.toc-title {
  font-size: var(--text-lg);
  font-weight: var(--font-extrabold);
  color: var(--color-text-primary);
  margin-bottom: var(--spacing-md);
  letter-spacing: -0.01em;
}
.toc-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-3) 0;
  border-bottom: 2px solid var(--color-border-light);
  transition: all var(--motion-fast);
}
.toc-item:active {
  transform: translate(2px, 2px);
}
@media (hover: hover) {
  .toc-item:hover {
    padding-left: var(--spacing-2);
  }
}
.toc-chapter {
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  color: var(--color-text-primary);
}
.toc-words {
  font-size: var(--text-xs);
  color: var(--color-text-tertiary);
}

/* ═══════════════════════════════════════════════════════════
   READER PAGE
   ═══════════════════════════════════════════════════════════ */

.reader-page {
  min-height: 100vh;
}
.reader-immersive {
  background: var(--reader-bg);
  color: var(--reader-text);
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  position: relative;
}

/* Progress bar */
.reader-progress {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--color-border-light);
  z-index: 31;
}
.reader-progress-bar {
  height: 100%;
  background: var(--color-primary);
  transition: width 0.3s ease;
  width: 0%;
}

/* Top toolbar */
.reader-topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 30;
  background: var(--color-surface);
  border-bottom: 3px solid var(--color-border);
  padding: var(--spacing-3) var(--spacing-4);
  padding-top: calc(var(--spacing-3) + env(safe-area-inset-top) + 3px);
  transition: transform var(--motion-smooth);
  transform: translateY(-100%);
}
.reader-topbar.show {
  transform: translateY(0);
}
.reader-topbar-inner {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
}
.reader-topbar-inner .truncate {
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 14px;
  font-weight: var(--font-bold);
  color: var(--color-text-primary);
}

/* Bottom toolbar */
.reader-bottombar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 20;
  background: var(--color-surface);
  border-top: 3px solid var(--color-border);
  padding: var(--spacing-3) var(--spacing-4);
  padding-bottom: calc(var(--spacing-3) + env(safe-area-inset-bottom));
  transition: transform var(--motion-smooth);
  transform: translateY(100%);
}
.reader-bottombar.show {
  transform: translateY(0);
}
.reader-bottombar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--spacing-2);
}

/* Navigation buttons */
.nav-btn {
  display: flex;
  align-items: center;
  gap: var(--spacing-2);
  padding: var(--spacing-2) var(--spacing-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text-primary);
  font-size: var(--text-sm);
  font-weight: var(--font-bold);
  text-decoration: none;
  transition: all var(--motion-fast);
  white-space: nowrap;
}
.nav-btn:active {
  transform: translate(2px, 2px);
}
.nav-btn.disabled {
  opacity: 0.3;
  pointer-events: none;
}

/* Tool buttons */
.tool-btn {
  display: flex;
  align-items: center;
  gap: var(--spacing-1);
  padding: var(--spacing-2) var(--spacing-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text-primary);
  font-size: var(--text-xs);
  font-weight: var(--font-bold);
  cursor: pointer;
  transition: all var(--motion-fast);
  white-space: nowrap;
}
.tool-btn svg {
  width: 16px;
  height: 16px;
}
.tool-btn:active {
  transform: translate(2px, 2px);
}

/* Reader content */
.reader-content {
  padding: var(--spacing-8) var(--spacing-lg);
  padding-top: 80px;
  padding-bottom: 120px;
  font-size: 18px;
  line-height: 1.8;
  max-width: 680px;
  margin: 0 auto;
}
.reader-content h1 {
  font-size: var(--text-2xl);
  font-weight: var(--font-extrabold);
  margin-bottom: var(--spacing-6);
  color: var(--color-text-primary);
  letter-spacing: -0.02em;
}
.reader-content p {
  margin-bottom: var(--spacing-4);
  text-indent: 2em;
}

/* Sheet overlay / bottom sheet */
.sheet-overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--motion-fast);
}
.sheet-overlay.active {
  opacity: 1;
  pointer-events: auto;
}
.sheet-content {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--color-surface);
  border-top: 3px solid var(--color-border);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  transform: translateY(100%);
  transition: transform var(--motion-smooth);
}
.sheet-overlay.active .sheet-content {
  transform: translateY(0);
}
.sheet-handle {
  width: 36px;
  height: 4px;
  background: var(--color-border);
  border-radius: var(--radius-full);
  margin: var(--spacing-3) auto;
  opacity: 0.3;
}
.sheet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-3) var(--spacing-4);
  border-bottom: 2px solid var(--color-border-light);
}
.sheet-header h3 {
  font-size: var(--text-lg);
  font-weight: var(--font-extrabold);
  color: var(--color-text-primary);
}
.sheet-body {
  padding: var(--spacing-4);
  overflow-y: auto;
  flex: 1;
}

/* Sheet TOC items */
.sheet-body .toc-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--spacing-3) 0;
  border-bottom: 2px solid var(--color-border-light);
  text-decoration: none;
  color: var(--color-text-primary);
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  transition: all var(--motion-fast);
}
.sheet-body .toc-item:active {
  transform: translate(2px, 2px);
}
@media (hover: hover) {
  .sheet-body .toc-item:hover {
    padding-left: var(--spacing-2);
  }
}

/* Settings */
.setting-group {
  margin-bottom: var(--spacing-4);
}
.setting-label {
  font-size: var(--text-sm);
  font-weight: var(--font-bold);
  color: var(--color-text-primary);
  margin-bottom: var(--spacing-2);
}
.setting-row {
  display: flex;
  gap: var(--spacing-2);
}
.setting-btn {
  flex: 1;
  padding: var(--spacing-3);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  font-weight: var(--font-bold);
  cursor: pointer;
  transition: all var(--motion-fast);
  text-align: center;
}
.setting-btn:active {
  transform: translate(2px, 2px);
}

/* TTS */
.tts-play-btn {
  width: 64px;
  height: 64px;
  border: 3px solid var(--color-border);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin: 0 auto var(--spacing-4);
  box-shadow: var(--shadow-sm);
  transition: all var(--motion-fast);
}
.tts-play-btn:active {
  transform: translate(3px, 3px);
  box-shadow: none;
}
.tts-progress-wrap {
  margin-bottom: var(--spacing-4);
}
.tts-progress-bar {
  width: 100%;
  height: 8px;
  background: var(--color-border-light);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-full);
  overflow: hidden;
  cursor: pointer;
}
.tts-progress-fill {
  height: 100%;
  background: var(--color-primary);
  transition: width 0.2s ease;
  border-radius: var(--radius-full);
}
.tts-progress-label {
  font-size: var(--text-xs);
  color: var(--color-text-tertiary);
  margin-top: var(--spacing-1);
  font-weight: var(--font-medium);
}
.tts-control {
  max-width: 300px;
  margin: 0 auto;
}
.tts-label {
  display: flex;
  justify-content: space-between;
  font-size: var(--text-sm);
  font-weight: var(--font-medium);
  color: var(--color-text-secondary);
}

/* TTS paragraph highlight */
.reader-content p[data-tts-idx].tts-active {
  background: rgba(255, 107, 0, 0.08);
  border-left: 3px solid var(--color-primary);
  padding-left: var(--spacing-3);
  transition: all var(--motion-fast);
}

/* ═══════════════════════════════════════════════════════════
   SEARCH PAGE
   ═══════════════════════════════════════════════════════════ */

.search-hero {
  padding: 80px var(--spacing-lg) var(--spacing-lg);
  text-align: center;
  background: var(--color-primary);
  border-bottom: 3px solid var(--color-border);
}
.search-input-wrapper {
  position: relative;
  max-width: 500px;
  margin: 0 auto;
}
.search-input {
  width: 100%;
  padding: var(--spacing-4) var(--spacing-5);
  padding-left: 48px;
  border: 3px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  font-size: var(--text-base);
  color: var(--color-text-primary);
  box-shadow: var(--shadow-sm);
  outline: none;
  transition: all var(--motion-fast);
}
.search-input:focus {
  box-shadow: var(--shadow-md);
  transform: translate(-2px, -2px);
}
.search-input::placeholder {
  color: var(--color-text-tertiary);
}
.search-icon {
  position: absolute;
  left: var(--spacing-4);
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-text-tertiary);
  pointer-events: none;
}

/* ═══════════════════════════════════════════════════════════
   CATEGORY PAGE
   ═══════════════════════════════════════════════════════════ */

.cat-header {
  padding-top: 56px;
  background: var(--color-primary);
  border-bottom: 3px solid var(--color-border);
}
.cat-header-inner {
  display: flex;
  align-items: center;
  gap: var(--spacing-3);
  padding: var(--spacing-3) var(--spacing-4);
}
.cat-header-title {
  font-size: var(--text-xl);
  font-weight: var(--font-extrabold);
  color: #fff;
}
.cat-header-back {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: var(--radius-md);
  background: transparent;
  color: #fff;
  cursor: pointer;
}

.book-list {
  padding: var(--spacing-4) 0;
}
.book-list-item {
  display: flex;
  gap: var(--spacing-4);
  padding: var(--spacing-4) var(--spacing-lg);
  border-bottom: 2px solid var(--color-border-light);
  transition: all var(--motion-fast);
}
.book-list-item:active {
  background: var(--color-border-light);
  transform: translate(2px, 2px);
}
@media (hover: hover) {
  .book-list-item:hover {
    background: var(--color-border-light);
  }
}
.book-list-cover {
  flex-shrink: 0;
}
.book-list-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.book-list-title {
  font-size: var(--text-base);
  font-weight: var(--font-bold);
  color: var(--color-text-primary);
  margin-bottom: 4px;
}
.book-list-meta {
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
}
.book-list-tags {
  display: flex;
  gap: var(--spacing-2);
  margin-top: var(--spacing-2);
}
.tag {
  display: inline-block;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: var(--font-bold);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text-secondary);
}

/* ═══════════════════════════════════════════════════════════
   LEGAL PAGES
   ═══════════════════════════════════════════════════════════ */

.legal-page {
